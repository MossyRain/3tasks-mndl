<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E7E8E8">
<title>3TASKS MNDL Safari v1.7</title>
<style>
:root{
  --bg:#E7E8E8;--panel:#F4F4F3;--text:#202120;--sub:#747675;
  --a1:#A30084;--a2:#B69100;--a3:#00466D;--accentText:#F4F4F1;
  --off:#D6D7D6;--done:#D0D1D0;
  --safeTop:env(safe-area-inset-top,0px);--safeBottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
.app{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.header{position:absolute;top:var(--safeTop);left:0;right:0;height:104px;padding:18px;background:var(--bg);z-index:5}
.date{font-size:11px;letter-spacing:.13em;color:var(--sub)}
.title{margin-top:4px;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.045em}
.viewport{position:absolute;left:0;right:0;top:calc(var(--safeTop) + 104px);bottom:calc(var(--safeBottom) + 84px);overflow:hidden}
.track{width:400%;height:100%;display:flex;transform:translate3d(0,0,0);transition:transform .23s cubic-bezier(.2,.8,.2,1);will-change:transform}
.page{width:25%;flex:0 0 25%;height:100%;padding:0 18px;overflow:hidden;min-width:0}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
.footer{position:absolute;left:18px;right:18px;bottom:calc(var(--safeBottom) + 20px);height:64px;background:var(--bg);border-top:1px solid rgba(32,33,32,.12);display:flex;align-items:center;justify-content:center;gap:22px;z-index:6}
.footer button{border:0;background:none;padding:10px 0;min-height:44px;font-size:10px;font-weight:760;color:var(--sub)}
.footer button.active{color:var(--text)}.gear{font-size:20px}
.appmeta{position:absolute;left:18px;right:18px;bottom:var(--safeBottom);height:20px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:9px;letter-spacing:.08em;z-index:7}
.cards{display:grid;gap:4px}
.card{min-height:102px;border:0;border-radius:12px;padding:15px 14px;display:grid;grid-template-columns:44px 1fr 30px;gap:9px;align-items:center;text-align:left;color:var(--accentText)}
.card.c1{background:var(--a1)}.card.c2{background:var(--a2)}.card.c3{background:var(--a3)}.card.done{background:var(--done);color:var(--text)}
.num{font-size:28px;font-weight:780}.taskName{font-size:16px;font-weight:730}.trail{font-size:10px;margin-top:5px;opacity:.76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:27px;height:27px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center}
.progress{height:4px;background:rgba(32,33,32,.12);border-radius:999px;margin-top:13px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--text)}.progressText{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--sub)}
.breadcrumb{min-height:28px;display:flex;gap:7px;align-items:center;overflow-x:auto;white-space:nowrap;margin-bottom:9px;font-size:11px;color:var(--sub)}
.breadcrumb button{border:0;background:none;padding:5px 0;color:inherit}
.mandalaWrap{position:relative;width:100%;aspect-ratio:1/1}
.mandala{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transition:transform .42s cubic-bezier(.18,.82,.2,1),opacity .22s ease}
.cell{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:3px;background:var(--panel);padding:7px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;transition:transform .18s ease,opacity .18s ease,color .42s linear}
.cell:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3));transition:opacity .42s linear}
.cell.center{color:var(--accentText)}.cell.center:before{opacity:1}.cell.holdIn,.cell.center.holdOut{transform:scale(.98)}
.cell.empty{font-size:22px;color:#A7A8A7;font-weight:400}.cell.empty:before{display:none}
.deep{position:absolute;right:5px;bottom:4px;opacity:.4}.hint{font-size:10px;color:var(--sub);margin-top:9px}
.ghost{position:absolute;z-index:20;border-radius:3px;background:var(--panel);display:grid;place-items:center;text-align:center;padding:7px;font-size:13px;font-weight:690;overflow:hidden;isolation:isolate;pointer-events:none;transition:left .42s cubic-bezier(.18,.82,.2,1),top .42s cubic-bezier(.18,.82,.2,1),width .42s cubic-bezier(.18,.82,.2,1),height .42s cubic-bezier(.18,.82,.2,1),opacity .16s ease}
.ghost.center:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.actions{display:grid;gap:4px}.action{background:var(--panel);border-radius:8px;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.actionCopy{min-width:0}.actionName{font-size:14px;font-weight:710}.actionTrail{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{border:0;border-radius:999px;min-width:48px;padding:8px 11px;font-size:10px;font-weight:800;color:var(--accentText);background:radial-gradient(circle at 5% 15%,var(--a1) 0 20%,transparent 54%),radial-gradient(circle at 95% 15%,var(--a2) 0 20%,transparent 54%),radial-gradient(circle at 50% 115%,var(--a3) 0 28%,transparent 62%),linear-gradient(135deg,var(--a1),var(--a2) 50%,var(--a3))}
.toggle.off{background:var(--off);color:#555}
.section{background:var(--panel);border-radius:12px;padding:13px;margin-bottom:8px}.section h2{margin:0 0 10px;font-size:11px;letter-spacing:.09em}
.paletteRow{width:100%;border:0;border-top:1px solid rgba(32,33,32,.09);background:none;min-height:53px;padding:9px 0;display:flex;align-items:center;justify-content:space-between;text-align:left}.paletteRow:first-of-type{border-top:0}.paletteName{font-size:13px;font-weight:720}.tag{font-size:9px;color:var(--sub);margin-left:6px}.dots{display:flex;gap:3px}.dots i{display:block;width:20px;height:20px;border-radius:5px}
.btn{border:0;border-radius:9px;padding:10px 12px;background:#D8D9D8;color:#202120;font-size:11px;font-weight:720;min-height:42px}.btn.primary{background:#171817;color:#fff}.btn.danger{color:#9B352F}.btn:disabled{opacity:.35}
.editor{display:none}.editor.show{display:block}.preview{height:52px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3px;margin:8px 0 10px}.preview div{border-radius:7px}.editRow{display:grid;grid-template-columns:1fr 44px 84px;gap:7px;align-items:center;padding:6px 0}.editRow label{font-size:11px}.editRow input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}.editRow input[type=text]{width:84px;border:0;border-radius:8px;background:var(--bg);padding:8px;font-size:11px}
.dataActions{display:flex;gap:6px;flex-wrap:wrap}.dataNote{font-size:10px;color:var(--sub);line-height:1.5;margin-top:8px}.fileInput{display:none}
.editSheet{position:absolute;left:18px;right:18px;bottom:calc(var(--safeBottom) + 104px);background:var(--panel);border-radius:14px;padding:14px;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.16);display:none}
.editSheet.show{display:block}.editTitle{font-size:14px;font-weight:760;margin-bottom:6px}.editTrail{font-size:10px;color:var(--sub);margin-bottom:10px}.editInput{width:100%;border:0;border-radius:9px;background:var(--bg);padding:11px;font-size:16px}.editActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.editBackdrop{position:absolute;inset:0;z-index:29;background:transparent;display:none}
.editBackdrop.show{display:block}
.editSheet{transition:opacity .14s ease,transform .14s ease}
.editSheet.hiddenBySwipe{opacity:0;transform:translateY(8px);pointer-events:none}
.moveSelect{width:100%;border:0;border-radius:9px;background:var(--bg);padding:11px;font-size:14px;margin-top:8px}
.movePanel{display:none;margin-top:10px}.movePanel.show{display:block}
.motionLayer{position:absolute;inset:0;pointer-events:none;z-index:19;overflow:visible}
.zoomClone{position:absolute;border-radius:3px;background:var(--panel);display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;padding:7px;overflow:hidden;isolation:isolate;transition:transform .46s cubic-bezier(.18,.82,.2,1),opacity .28s ease}
.zoomClone.centerLike{color:var(--accentText)}
.zoomClone.centerLike:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.parentIncoming{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;opacity:0;transform:scale(1.32);transition:transform .46s cubic-bezier(.18,.82,.2,1),opacity .32s ease}
.parentIncoming.show{opacity:1;transform:scale(1)}
.childOutgoing{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transition:transform .46s cubic-bezier(.18,.82,.2,1),opacity .28s ease}

</style>
</head>
<body>
<div class="app">
<header class="header"><div class="date">SAT 22 AUG</div><div class="title" id="title">TODAY</div></header>
<div class="viewport" id="viewport"><div class="track" id="track">

<section class="page"><div class="scroll">
<div class="cards" id="cards"></div>
<div class="progress"><i id="bar"></i></div><div class="progressText"><span>今日の進捗</span><span id="count">0 / 3</span></div>
</div></section>

<section class="page"><div class="scroll">
<div class="breadcrumb" id="breadcrumb"></div>
<div class="mandalaWrap" id="mandalaWrap"><div class="mandala" id="mandala"></div><div class="motionLayer" id="motionLayer"></div></div>
<div class="hint">タップ：EDIT CELL ／ 長押し：9マス全体へ拡大して深掘り ／ 中央長押し：親セル位置へ縮小して戻る</div>
</div></section>

<section class="page"><div class="scroll"><div class="actions" id="actions"></div></div></section>

<section class="page"><div class="scroll">
<div class="section"><h2>COLOR PALETTE</h2><div id="paletteList"></div><button class="btn" id="newPalette">＋ NEW PALETTE</button></div>
<div class="section editor" id="editor"><h2 id="editorTitle">EDIT PALETTE</h2><div class="preview" id="preview"></div><div id="editRows"></div><div class="editActions"><button class="btn primary" id="saveAsPalette">新しいパレットとして保存</button><button class="btn" id="overwritePalette">上書き保存</button><button class="btn danger" id="deletePalette">削除</button></div></div>
<div class="section"><h2>DATA</h2><div class="dataActions"><button class="btn" id="exportBtn">JSONを書き出す</button><button class="btn" id="importBtn">JSONを読み込む</button><input class="fileInput" id="importFile" type="file" accept="application/json,.json"></div><div class="dataNote">Safari内へ自動保存し、JSONでもバックアップできます。</div></div>
</div></section>

</div></div>

<nav class="footer"><button class="active" data-page="0">TODAY</button><button data-page="1">MANDALA</button><button data-page="2">ACTIONS</button><button data-page="3"><span class="gear">⚙︎</span></button></nav>
<div class="appmeta">3TASKS MNDL · v1.7</div>

<div class="editBackdrop" id="editBackdrop"></div><div class="editSheet" id="editSheet">
  <div class="editTitle">EDIT CELL</div>
  <div class="editTrail" id="editTrail"></div>
  <input class="editInput" id="editInput" type="text" placeholder="項目名">
  <div class="editActions">
    <button class="btn primary" id="editSave">保存</button>
    <button class="btn" id="moveCell">移動</button>
    <button class="btn danger" id="deleteCell">削除</button>
    <button class="btn" id="editClose">閉じる</button>
  </div>
  <div class="movePanel" id="movePanel">
    <select class="moveSelect" id="moveSelect"></select>
    <div class="editActions">
      <button class="btn primary" id="moveApply">ここへ移動</button>
      <button class="btn" id="moveCancel">キャンセル</button>
    </div>
  </div>
</div>
</div>

<script>

(function(){
var STORAGE="mndl-v17";
var track=document.getElementById("track"),viewport=document.getElementById("viewport"),title=document.getElementById("title"),wrap=document.getElementById("mandalaWrap"),motionLayer=document.getElementById("motionLayer");
var page=0,gesture=null,currentNode="life",editingId=null,editingEmptySlot=null,editingPalette=null,busy=false,editVisiblePage=1;

var builtins=[
 {id:"signal",name:"SIGNAL",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#A30084",a2:"#B69100",a3:"#00466D",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},
 {id:"bau",name:"BAU",builtIn:true,c:{bg:"#E9E9E9",panel:"#F3F3F3",text:"#171717",sub:"#737373",a1:"#C94A3F",a2:"#315A9F",a3:"#9A7226",accentText:"#F2F2EF",off:"#D3D3D3",done:"#CFCFCF"}},
 {id:"mist",name:"MIST",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#94CDC2",a2:"#C9C3AE",a3:"#8F7C9A",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}}
];

var defaultNodes={
 life:{id:"life",name:"人生",parent:null,children:["health","learn","create","family","money","play"]},
 health:{id:"health",name:"健康",parent:"life",children:["sleep","food","exercise","rest"]},
 learn:{id:"learn",name:"学び",parent:"life",children:["reading"]},
 create:{id:"create",name:"創作",parent:"life",children:["sketch"]},
 family:{id:"family",name:"家族と過ごす",parent:"life",children:[]},
 money:{id:"money",name:"家計を確認する",parent:"life",children:[]},
 play:{id:"play",name:"新しいことを試す",parent:"life",children:[]},
 sleep:{id:"sleep",name:"睡眠",parent:"health",children:["bed"]},
 food:{id:"food",name:"食事を整える",parent:"health",children:[]},
 exercise:{id:"exercise",name:"運動",parent:"health",children:["bike","squat"]},
 rest:{id:"rest",name:"休息",parent:"health",children:["break10"]},
 reading:{id:"reading",name:"読書",parent:"learn",children:["book10"]},
 sketch:{id:"sketch",name:"造形",parent:"create",children:["sketch1"]},
 bed:{id:"bed",name:"23時までに寝る",parent:"sleep",children:[]},
 bike:{id:"bike",name:"20分自転車に乗る",parent:"exercise",children:[]},
 squat:{id:"squat",name:"スクワット10回",parent:"exercise",children:[]},
 break10:{id:"break10",name:"10分休む",parent:"rest",children:[]},
 book10:{id:"book10",name:"本を10ページ読む",parent:"reading",children:[]},
 sketch1:{id:"sketch1",name:"スケッチを1つ描く",parent:"sketch",children:[]}
};

var state={nodes:JSON.parse(JSON.stringify(defaultNodes)),enabled:{},today:[{id:"bike",tone:1,done:false},{id:"book10",tone:2,done:false},{id:"sketch1",tone:3,done:false}],customPalettes:[],activePaletteId:"signal"};

function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(STORAGE)||"null");if(s&&s.nodes)state=Object.assign(state,s)}catch(e){}}
function node(id){return state.nodes[id]}
function pathIds(id){var a=[],n=node(id);while(n){a.unshift(n.id);n=n.parent?node(n.parent):null}return a}
function trail(id){return pathIds(id).slice(0,-1).map(function(x){return node(x).name}).join(" ← ")}
function leaves(){return Object.keys(state.nodes).map(function(k){return state.nodes[k]}).filter(function(n){return n.id!=="life"&&n.children.length===0})}

function hideEditForSwipe(){
 var sheet=document.getElementById("editSheet");
 if(sheet.classList.contains("show"))sheet.classList.add("hiddenBySwipe");
}
function restoreEditIfMandala(){
 var sheet=document.getElementById("editSheet");
 if(page===1 && sheet.classList.contains("show"))sheet.classList.remove("hiddenBySwipe");
}
function setPage(n,animate){
 page=Math.max(0,Math.min(3,n));
 track.style.transition=animate===false?"none":"transform .23s cubic-bezier(.2,.8,.2,1)";
 track.style.transform="translate3d(-"+(page*25)+"%,0,0)";
 title.textContent=["TODAY","MANDALA","ACTIONS","SETTINGS"][page];
 var bs=document.querySelectorAll("[data-page]");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("active",i===page);
 if(page===1)restoreEditIfMandala();
}
var nav=document.querySelectorAll("[data-page]");for(var i=0;i<nav.length;i++){(function(idx){nav[idx].onclick=function(){if(idx!==1)hideEditForSwipe();setPage(idx,true)}})(i)}

viewport.addEventListener("touchstart",function(e){
 if(e.touches.length!==1||e.target.closest("input,select,.editor"))return;
 var t=e.touches[0];gesture={x:t.clientX,y:t.clientY,dx:0,dy:0,axis:"",start:page};track.style.transition="none";
},{passive:true});
viewport.addEventListener("touchmove",function(e){
 if(!gesture||e.touches.length!==1)return;var t=e.touches[0];
 gesture.dx=t.clientX-gesture.x;gesture.dy=t.clientY-gesture.y;
 if(!gesture.axis&&(Math.abs(gesture.dx)>8||Math.abs(gesture.dy)>8))gesture.axis=Math.abs(gesture.dx)>Math.abs(gesture.dy)*1.15?"x":"y";
 if(gesture.axis==="x"){
   hideEditForSwipe();
   var dx=gesture.dx;if((page===0&&dx>0)||(page===3&&dx<0))dx*=.28;
   track.style.transform="translate3d("+(-page*viewport.clientWidth+dx)+"px,0,0)";
 }
},{passive:true});
viewport.addEventListener("touchend",function(){
 if(!gesture)return;var g=gesture;gesture=null;
 if(g.axis==="x"&&Math.abs(g.dx)>55)setPage(g.start+(g.dx<0?1:-1),true);else setPage(g.start,true);
},{passive:true});

function renderToday(){
 var box=document.getElementById("cards");box.innerHTML="";
 state.today.forEach(function(t,i){var n=node(t.id);if(!n)return;var b=document.createElement("button");b.className="card c"+t.tone+(t.done?" done":"");b.innerHTML="<div class='num'>0"+(i+1)+"</div><div><div class='taskName'>"+n.name+"</div><div class='trail'>"+trail(t.id)+"</div></div><div class='check'>"+(t.done?"✓":"")+"</div>";b.onclick=function(){t.done=!t.done;save();renderToday()};box.appendChild(b)});
 var d=state.today.filter(function(x){return x.done}).length;document.getElementById("count").textContent=d+" / 3";document.getElementById("bar").style.width=(d/3*100)+"%";
}
function renderActions(){
 var box=document.getElementById("actions");box.innerHTML="";
 leaves().forEach(function(n){var on=state.enabled[n.id]!==false,d=document.createElement("div");d.className="action";d.innerHTML="<div class='actionCopy'><div class='actionName'>"+n.name+"</div><div class='actionTrail'>"+trail(n.id)+"</div></div><button class='toggle "+(on?"":"off")+"'>"+(on?"ON":"OFF")+"</button>";d.querySelector(".toggle").onclick=function(){state.enabled[n.id]=!on;save();renderActions()};box.appendChild(d)});
}
function renderBreadcrumb(){
 var box=document.getElementById("breadcrumb");box.innerHTML="";var ids=pathIds(currentNode);
 ids.forEach(function(id,i){var b=document.createElement("button");b.textContent=node(id).name;b.onclick=function(){currentNode=id;renderMandala()};box.appendChild(b);if(i<ids.length-1){var s=document.createElement("span");s.textContent="←";box.appendChild(s)}});
}

function rectInWrap(el){var a=el.getBoundingClientRect(),w=wrap.getBoundingClientRect();return{left:a.left-w.left,top:a.top-w.top,width:a.width,height:a.height}}
function makeCloneFromCell(el,text,center){
 var r=rectInWrap(el),g=document.createElement("div");g.className="zoomClone"+(center?" centerLike":"");g.textContent=text;
 g.style.left=r.left+"px";g.style.top=r.top+"px";g.style.width=r.width+"px";g.style.height=r.height+"px";
 motionLayer.appendChild(g);return{el:g,rect:r};
}
function fullRect(){return{left:0,top:0,width:wrap.clientWidth,height:wrap.clientHeight}}

function animateDeeper(source,id){
 if(busy)return;busy=true;
 var grid=document.getElementById("mandala");
 var srcRect=rectInWrap(source);
 var centerX=srcRect.left+srcRect.width/2,centerY=srcRect.top+srcRect.height/2;
 var cells=Array.from(grid.children);
 var clones=[];
 cells.forEach(function(c){
   var r=rectInWrap(c),cl=document.createElement("div");
   cl.className="zoomClone"+(c.classList.contains("center")?" centerLike":"");
   cl.textContent=c.textContent.replace("›","");
   cl.style.left=r.left+"px";cl.style.top=r.top+"px";cl.style.width=r.width+"px";cl.style.height=r.height+"px";
   motionLayer.appendChild(cl);clones.push({el:cl,rect:r,isTarget:c===source});
 });
 grid.style.opacity="0";

 requestAnimationFrame(function(){requestAnimationFrame(function(){
   clones.forEach(function(o){
     var cX=o.rect.left+o.rect.width/2,cY=o.rect.top+o.rect.height/2;
     var dx=cX-centerX,dy=cY-centerY;
     if(o.isTarget){
       var sx=wrap.clientWidth/o.rect.width,sy=wrap.clientHeight/o.rect.height;
       o.el.style.transform="translate("+(-o.rect.left)+"px,"+(-o.rect.top)+"px) scale("+sx+","+sy+")";
       o.el.style.transformOrigin="top left";
     }else{
       o.el.style.transform="translate("+(dx*2.5)+"px,"+(dy*2.5)+"px) scale(1.55)";
       o.el.style.opacity="0";
     }
   });
 })});

 setTimeout(function(){
   currentNode=id;
   renderMandala();
   document.getElementById("mandala").style.opacity="1";
   clones.forEach(function(o){o.el.remove()});busy=false;
 },470);
}

function renderGridSnapshot(nodeId,container){
 var n=node(nodeId),slots=[0,1,2,3,"c",4,5,6,7];
 slots.forEach(function(s){
   var d=document.createElement("div");d.className="cell";
   if(s==="c"){d.classList.add("center");d.textContent=n.name}
   else{var id=n.children[s];if(id){d.textContent=node(id).name}else{d.classList.add("empty");d.textContent="＋"}}
   container.appendChild(d);
 });
}

function animateBack(){
 if(busy)return;
 var child=currentNode,parentId=node(child).parent;if(!parentId)return;
 busy=true;
 var grid=document.getElementById("mandala");
 var parent=node(parentId),childIndex=parent.children.indexOf(child),map=[0,1,2,3,5,6,7,8];

 // outgoing current 9 cells
 var outgoing=document.createElement("div");outgoing.className="childOutgoing";
 Array.from(grid.children).forEach(function(c){
   var d=c.cloneNode(true);d.removeAttribute("id");outgoing.appendChild(d);
 });
 motionLayer.appendChild(outgoing);
 grid.style.opacity="0";

 // incoming parent grid, start oversized/offscreen
 var incoming=document.createElement("div");incoming.className="parentIncoming";
 renderGridSnapshot(parentId,incoming);
 motionLayer.appendChild(incoming);

 // destination geometry within parent grid
 var slotEl=incoming.children[map[childIndex]];
 var stageRect=wrap.getBoundingClientRect();
 var slotRect=slotEl.getBoundingClientRect();
 var dest={left:slotRect.left-stageRect.left,top:slotRect.top-stageRect.top,width:slotRect.width,height:slotRect.height};

 requestAnimationFrame(function(){requestAnimationFrame(function(){
   // entire child grid collapses into destination cell
   var sx=dest.width/wrap.clientWidth,sy=dest.height/wrap.clientHeight;
   outgoing.style.transformOrigin="top left";
   outgoing.style.transform="translate("+dest.left+"px,"+dest.top+"px) scale("+sx+","+sy+")";
   outgoing.style.opacity=".72";
   incoming.classList.add("show");
 })});

 setTimeout(function(){
   currentNode=parentId;
   renderMandala();
   document.getElementById("mandala").style.opacity="1";
   outgoing.remove();incoming.remove();busy=false;
 },470);
}

function buildMoveOptions(){
 var sel=document.getElementById("moveSelect");sel.innerHTML="";
 function walk(id,depth){
   var n=node(id);
   if(id!==editingId && n.children.length<8 && !isDescendant(editingId,id)){
     var opt=document.createElement("option");opt.value=id;opt.textContent="　".repeat(depth)+n.name;sel.appendChild(opt);
   }
   n.children.forEach(function(ch){walk(ch,depth+1)});
 }
 walk("life",0);
}
function isDescendant(sourceId,candidateId){
 if(!sourceId)return false;
 var n=node(candidateId);
 while(n){if(n.parent===sourceId)return true;n=n.parent?node(n.parent):null}
 return false;
}
function showEdit(){
 document.getElementById("editBackdrop").classList.add("show");
 document.getElementById("editSheet").classList.add("show");
 document.getElementById("editSheet").classList.remove("hiddenBySwipe");
 document.getElementById("movePanel").classList.remove("show");
}
function closeEdit(){
 document.getElementById("editBackdrop").classList.remove("show");
 document.getElementById("editSheet").classList.remove("show","hiddenBySwipe");
 document.getElementById("movePanel").classList.remove("show");
}
function openEditExisting(id){
 editingId=id;editingEmptySlot=null;
 document.getElementById("editTrail").textContent=pathIds(id).map(function(x){return node(x).name}).join(" ← ");
 document.getElementById("editInput").value=node(id).name;
 document.getElementById("moveCell").disabled=(id==="life");
 document.getElementById("deleteCell").disabled=(id==="life");
 showEdit();
}
function openEditEmpty(slot){
 editingId=null;editingEmptySlot=slot;
 document.getElementById("editTrail").textContent=pathIds(currentNode).map(function(x){return node(x).name}).join(" ← ")+" ← ＋";
 document.getElementById("editInput").value="";
 document.getElementById("moveCell").disabled=true;document.getElementById("deleteCell").disabled=true;
 showEdit();
}
document.getElementById("editBackdrop").onclick=closeEdit;
document.getElementById("editClose").onclick=closeEdit;
document.getElementById("editSave").onclick=function(){
 var v=document.getElementById("editInput").value.trim();if(!v)return;
 if(editingId){node(editingId).name=v}
 else if(editingEmptySlot!==null){var p=node(currentNode),id="n"+Date.now();state.nodes[id]={id:id,name:v,parent:currentNode,children:[]};p.children.splice(editingEmptySlot,0,id)}
 save();closeEdit();renderAll();
};
document.getElementById("deleteCell").onclick=function(){
 if(!editingId||editingId==="life")return;
 var label=node(editingId).name;
 if(!confirm("「"+label+"」を削除します。\n子項目がある場合は、その下の項目もすべて削除されます。よろしいですか？"))return;
 var n=node(editingId),p=node(n.parent);p.children=p.children.filter(function(x){return x!==editingId});
 function removeTree(id){node(id).children.slice().forEach(removeTree);delete state.nodes[id];delete state.enabled[id]}
 removeTree(editingId);
 state.today=state.today.filter(function(t){return !!state.nodes[t.id]});
 save();closeEdit();renderAll();
};
document.getElementById("moveCell").onclick=function(){
 if(!editingId||editingId==="life")return;
 buildMoveOptions();
 document.getElementById("movePanel").classList.add("show");
};
document.getElementById("moveCancel").onclick=function(){document.getElementById("movePanel").classList.remove("show")};
document.getElementById("moveApply").onclick=function(){
 var destId=document.getElementById("moveSelect").value;if(!destId||!editingId)return;
 var n=node(editingId),old=node(n.parent),dest=node(destId);
 if(!dest||dest.children.length>=8)return;
 old.children=old.children.filter(function(x){return x!==editingId});
 dest.children.push(editingId);n.parent=destId;
 save();closeEdit();renderAll();
};

function bindCell(el,id,isCenter){
 var timer=null,sx=0,sy=0,moved=false,longDone=false;
 function start(e){
   if(busy||e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false;longDone=false;
   if(isCenter&&!node(currentNode).parent)return;
   el.classList.add(isCenter?"holdOut":"holdIn");
   timer=setTimeout(function(){if(moved)return;longDone=true;el.classList.remove("holdIn","holdOut");if(isCenter)animateBack();else animateDeeper(el,id)},430);
 }
 function move(e){if(!e.touches.length)return;var t=e.touches[0];if(Math.hypot(t.clientX-sx,t.clientY-sy)>12){moved=true;clearTimeout(timer);el.classList.remove("holdIn","holdOut")}}
 function end(){clearTimeout(timer);el.classList.remove("holdIn","holdOut");if(!longDone&&!moved)openEditExisting(id)}
 el.addEventListener("touchstart",start,{passive:true});el.addEventListener("touchmove",move,{passive:true});el.addEventListener("touchend",end,{passive:true});el.addEventListener("touchcancel",function(){clearTimeout(timer);el.classList.remove("holdIn","holdOut")},{passive:true});
 if(!("ontouchstart" in window))el.onclick=function(){openEditExisting(id)};
}
function renderMandala(){
 renderBreadcrumb();var box=document.getElementById("mandala");box.innerHTML="";box.style.opacity="1";var cur=node(currentNode),slots=[0,1,2,3,"c",4,5,6,7];
 slots.forEach(function(s){
   var b=document.createElement("button");
   if(s==="c"){b.className="cell center";b.textContent=cur.name;bindCell(b,cur.id,true)}
   else{
     var id=cur.children[s];
     if(id){b.className="cell";b.innerHTML="<span>"+node(id).name+"</span>"+(node(id).children.length?"<span class='deep'>›</span>":"");bindCell(b,id,false)}
     else{b.className="cell empty";b.textContent="＋";(function(slot){b.onclick=function(){openEditEmpty(slot)}})(s)}
   }
   box.appendChild(b);
 });
}

function palettes(){return builtins.concat(state.customPalettes||[])}
function activePalette(){return palettes().find(function(p){return p.id===state.activePaletteId})||builtins[0]}
function applyPalette(p){state.activePaletteId=p.id;Object.keys(p.c).forEach(function(k){document.documentElement.style.setProperty("--"+k,p.c[k])});save()}
function renderPaletteList(){
 var box=document.getElementById("paletteList");box.innerHTML="";
 palettes().forEach(function(p){var b=document.createElement("button");b.className="paletteRow";b.innerHTML="<span><span class='paletteName'>"+p.name+"</span><span class='tag'>"+(p.builtIn?"DEFAULT":"CUSTOM")+"</span></span><span class='dots'><i style='background:"+p.c.a1+"'></i><i style='background:"+p.c.a2+"'></i><i style='background:"+p.c.a3+"'></i></span>";b.onclick=function(){applyPalette(p);openPaletteEditor(p)};box.appendChild(b)});
}
var paletteLabels={bg:"Background",panel:"Panel / Cell",text:"Primary Text",sub:"Secondary Text",a1:"Accent 1",a2:"Accent 2",a3:"Accent 3",accentText:"Accent Text",off:"OFF",done:"Completed"};
function openPaletteEditor(p){editingPalette={id:p.id,name:p.name,builtIn:p.builtIn,c:Object.assign({},p.c)};document.getElementById("editor").classList.add("show");document.getElementById("editorTitle").textContent="EDIT · "+p.name;renderPaletteEditor()}
function renderPaletteEditor(){
 var rows=document.getElementById("editRows");rows.innerHTML="";
 Object.keys(paletteLabels).forEach(function(k){var r=document.createElement("div");r.className="editRow";r.innerHTML="<label>"+paletteLabels[k]+"</label><input type='color' value='"+editingPalette.c[k]+"'><input type='text' value='"+editingPalette.c[k]+"'>";var pick=r.children[1],hex=r.children[2];pick.oninput=function(){editingPalette.c[k]=pick.value.toUpperCase();hex.value=editingPalette.c[k];previewPalette()};hex.onchange=function(){var v=hex.value.trim();if(v.charAt(0)!=="#")v="#"+v;if(/^#[0-9A-Fa-f]{6}$/.test(v)){editingPalette.c[k]=v.toUpperCase();pick.value=v;previewPalette()}else hex.value=editingPalette.c[k]};rows.appendChild(r)});
 document.getElementById("overwritePalette").style.display=editingPalette.builtIn?"none":"inline-block";document.getElementById("deletePalette").style.display=editingPalette.builtIn?"none":"inline-block";previewPalette();
}
function previewPalette(){Object.keys(editingPalette.c).forEach(function(k){document.documentElement.style.setProperty("--"+k,editingPalette.c[k])});document.getElementById("preview").innerHTML="<div style='background:"+editingPalette.c.bg+"'></div><div style='background:"+editingPalette.c.a1+"'></div><div style='background:"+editingPalette.c.a2+"'></div><div style='background:"+editingPalette.c.a3+"'></div>"}
document.getElementById("newPalette").onclick=function(){var p=activePalette();editingPalette={id:"c"+Date.now(),name:"MY PALETTE "+(state.customPalettes.length+1),builtIn:false,c:Object.assign({},p.c)};document.getElementById("editor").classList.add("show");document.getElementById("editorTitle").textContent="NEW PALETTE";renderPaletteEditor()};
document.getElementById("saveAsPalette").onclick=function(){var p={id:"c"+Date.now(),name:editingPalette.builtIn?editingPalette.name+" CUSTOM":editingPalette.name+" COPY",builtIn:false,c:Object.assign({},editingPalette.c)};state.customPalettes.push(p);applyPalette(p);save();renderPaletteList();openPaletteEditor(p)};
document.getElementById("overwritePalette").onclick=function(){if(!editingPalette||editingPalette.builtIn)return;var i=state.customPalettes.findIndex(function(x){return x.id===editingPalette.id});if(i>=0){state.customPalettes[i]={id:editingPalette.id,name:editingPalette.name,builtIn:false,c:Object.assign({},editingPalette.c)};applyPalette(state.customPalettes[i]);save();renderPaletteList()}};
document.getElementById("deletePalette").onclick=function(){if(!editingPalette||editingPalette.builtIn)return;state.customPalettes=state.customPalettes.filter(function(x){return x.id!==editingPalette.id});document.getElementById("editor").classList.remove("show");applyPalette(builtins[0]);save();renderPaletteList()};

document.getElementById("exportBtn").onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="3tasks-mndl-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)};
document.getElementById("importBtn").onclick=function(){document.getElementById("importFile").click()};
document.getElementById("importFile").onchange=function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.nodes||!x.today)throw new Error();state=x;state.customPalettes=state.customPalettes||[];currentNode="life";save();applyPalette(activePalette());renderAll();alert("復元しました")}catch(err){alert("読み込めないJSONです")}};r.readAsText(file)};

function renderAll(){renderToday();renderActions();renderMandala();renderPaletteList()}
load();state.customPalettes=state.customPalettes||[];applyPalette(activePalette());renderAll();setPage(0,false);
})();

</script>
