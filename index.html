<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E7E8E8">
<title>3TASKS MNDL Safari v1.3</title>
<style>
:root{
  --bg:#E7E8E8;--panel:#F4F4F3;--text:#202120;--sub:#747675;
  --a1:#A30084;--a2:#B69100;--a3:#00466D;--accentText:#F4F4F1;
  --off:#D6D7D6;--done:#D0D1D0;
  --safeTop:env(safe-area-inset-top,0px);--safeBottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
.app{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.header{position:absolute;top:var(--safeTop);left:0;right:0;height:104px;padding:18px;background:var(--bg);z-index:5}
.date{font-size:11px;letter-spacing:.13em;color:var(--sub)}
.title{margin-top:4px;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.045em}
.viewport{position:absolute;left:0;right:0;top:calc(var(--safeTop) + 104px);bottom:calc(var(--safeBottom) + 64px);overflow:hidden}
.track{width:400%;height:100%;display:flex;transform:translate3d(0,0,0);transition:transform .23s cubic-bezier(.2,.8,.2,1);will-change:transform}
.page{width:25%;flex:0 0 25%;height:100%;padding:0 18px;overflow:hidden;min-width:0}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
.footer{position:absolute;left:18px;right:18px;bottom:var(--safeBottom);height:64px;background:var(--bg);border-top:1px solid rgba(32,33,32,.12);display:flex;align-items:center;justify-content:center;gap:22px;z-index:6}
.footer button{border:0;background:none;padding:10px 0;min-height:44px;font-size:10px;font-weight:760;color:var(--sub)}
.footer button.active{color:var(--text)}.gear{font-size:20px}
.cards{display:grid;gap:4px}
.card{min-height:102px;border:0;border-radius:12px;padding:15px 14px;display:grid;grid-template-columns:44px 1fr 30px;gap:9px;align-items:center;text-align:left;color:var(--accentText)}
.card.c1{background:var(--a1)}.card.c2{background:var(--a2)}.card.c3{background:var(--a3)}.card.done{background:var(--done);color:var(--text)}
.num{font-size:28px;font-weight:780}.taskName{font-size:16px;font-weight:730}.trail{font-size:10px;margin-top:5px;opacity:.76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:27px;height:27px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center}
.progress{height:4px;background:rgba(32,33,32,.12);border-radius:999px;margin-top:13px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--text)}.progressText{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--sub)}
.breadcrumb{min-height:28px;display:flex;gap:7px;align-items:center;overflow-x:auto;white-space:nowrap;margin-bottom:9px;font-size:11px;color:var(--sub)}
.breadcrumb button{border:0;background:none;padding:5px 0;color:inherit}
.mandala{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;aspect-ratio:1/1}
.cell{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:3px;background:var(--panel);padding:7px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690}
.cell:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3));transition:opacity .42s linear}
.cell.center{color:var(--accentText)}.cell.center:before,.cell.holdIn:before{opacity:1}.cell.holdIn{color:var(--accentText)}.cell.center.holdOut:before{opacity:0}.cell.center.holdOut{color:var(--text)}
.deep{position:absolute;right:5px;bottom:4px;opacity:.4}.hint{font-size:10px;color:var(--sub);margin-top:9px}
.actions{display:grid;gap:4px}.action{background:var(--panel);border-radius:8px;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.actionCopy{min-width:0}.actionName{font-size:14px;font-weight:710}.actionTrail{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{border:0;border-radius:999px;min-width:48px;padding:8px 11px;font-size:10px;font-weight:800;color:var(--accentText);background:radial-gradient(circle at 5% 15%,var(--a1) 0 20%,transparent 54%),radial-gradient(circle at 95% 15%,var(--a2) 0 20%,transparent 54%),radial-gradient(circle at 50% 115%,var(--a3) 0 28%,transparent 62%),linear-gradient(135deg,var(--a1),var(--a2) 50%,var(--a3))}
.toggle.off{background:var(--off);color:#555}
.section{background:var(--panel);border-radius:12px;padding:13px;margin-bottom:8px}.section h2{margin:0 0 10px;font-size:11px;letter-spacing:.09em}
.paletteRow{width:100%;border:0;border-top:1px solid rgba(32,33,32,.09);background:none;min-height:53px;padding:9px 0;display:flex;align-items:center;justify-content:space-between;text-align:left}.paletteRow:first-of-type{border-top:0}.paletteName{font-size:13px;font-weight:720}.tag{font-size:9px;color:var(--sub);margin-left:6px}.dots{display:flex;gap:3px}.dots i{display:block;width:20px;height:20px;border-radius:5px}
.btn{border:0;border-radius:9px;padding:10px 12px;background:#D8D9D8;color:#202120;font-size:11px;font-weight:720;min-height:42px}.btn.primary{background:#171817;color:#fff}
.editor{display:none}.editor.show{display:block}.preview{height:52px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3px;margin:8px 0 10px}.preview div{border-radius:7px}.editRow{display:grid;grid-template-columns:1fr 44px 84px;gap:7px;align-items:center;padding:6px 0}.editRow label{font-size:11px}.editRow input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}.editRow input[type=text]{width:84px;border:0;border-radius:8px;background:var(--bg);padding:8px;font-size:11px}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="date">SAT 22 AUG</div><div class="title" id="title">TODAY</div></header>
<div class="viewport" id="viewport">
<div class="track" id="track">

<section class="page"><div class="scroll">
<div class="cards">
<button class="card c1" data-today="0"><div class="num">01</div><div><div class="taskName">20分自転車に乗る</div><div class="trail">人生 ← 健康 ← 運動</div></div><div class="check"></div></button>
<button class="card c2" data-today="1"><div class="num">02</div><div><div class="taskName">本を10ページ読む</div><div class="trail">人生 ← 学び ← 読書</div></div><div class="check"></div></button>
<button class="card c3" data-today="2"><div class="num">03</div><div><div class="taskName">スケッチを1つ描く</div><div class="trail">人生 ← 創作 ← 造形</div></div><div class="check"></div></button>
</div>
<div class="progress"><i id="bar"></i></div><div class="progressText"><span>今日の進捗</span><span id="count">0 / 3</span></div>
</div></section>

<section class="page"><div class="scroll">
<div class="breadcrumb"><button>人生</button></div>
<div class="mandala" id="mandala">
<button class="cell" data-deep="health">健康<span class="deep">›</span></button><button class="cell" data-deep="learn">学び<span class="deep">›</span></button><button class="cell" data-deep="create">創作<span class="deep">›</span></button>
<button class="cell">家族と過ごす</button><button class="cell center" id="centerCell">人生</button><button class="cell">家計を確認する</button>
<button class="cell">新しいことを試す</button><button class="cell">＋</button><button class="cell">＋</button>
</div><div class="hint">長押し：色が満ちて深掘り ／ 中央長押し：色が抜けて戻る</div>
</div></section>

<section class="page"><div class="scroll">
<div class="actions">
<div class="action"><div class="actionCopy"><div class="actionName">20分自転車に乗る</div><div class="actionTrail">人生 ← 健康 ← 運動</div></div><button class="toggle">ON</button></div>
<div class="action"><div class="actionCopy"><div class="actionName">本を10ページ読む</div><div class="actionTrail">人生 ← 学び ← 読書</div></div><button class="toggle">ON</button></div>
<div class="action"><div class="actionCopy"><div class="actionName">スケッチを1つ描く</div><div class="actionTrail">人生 ← 創作 ← 造形</div></div><button class="toggle">ON</button></div>
<div class="action"><div class="actionCopy"><div class="actionName">23時までに寝る</div><div class="actionTrail">人生 ← 健康 ← 睡眠</div></div><button class="toggle">ON</button></div>
</div>
</div></section>

<section class="page"><div class="scroll">
<div class="section"><h2>COLOR PALETTE</h2>
<button class="paletteRow" data-palette="main"><span><span class="paletteName">SIGNAL</span><span class="tag">DEFAULT</span></span><span class="dots"><i style="background:#A30084"></i><i style="background:#B69100"></i><i style="background:#00466D"></i></span></button>
<button class="paletteRow" data-palette="bau"><span><span class="paletteName">BAU</span><span class="tag">DEFAULT</span></span><span class="dots"><i style="background:#C94A3F"></i><i style="background:#315A9F"></i><i style="background:#9A7226"></i></span></button>
<button class="paletteRow" data-palette="mist"><span><span class="paletteName">MIST</span><span class="tag">DEFAULT</span></span><span class="dots"><i style="background:#94CDC2"></i><i style="background:#C9C3AE"></i><i style="background:#8F7C9A"></i></span></button>
<button class="btn" id="newPalette">＋ NEW PALETTE</button>
</div>
<div class="section editor" id="editor"><h2>EDIT PALETTE</h2><div class="preview" id="preview"></div><div id="editRows"></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="savePalette">新しいパレットとして保存</button></div></div>
</div></section>

</div></div>
<nav class="footer"><button class="active" data-page="0">TODAY</button><button data-page="1">MANDALA</button><button data-page="2">ACTIONS</button><button data-page="3"><span class="gear">⚙︎</span></button></nav>
</div>

<script>
(function(){
var track=document.getElementById("track");
var viewport=document.getElementById("viewport");
var title=document.getElementById("title");
var page=0;
var titles=["TODAY","MANDALA","ACTIONS","SETTINGS"];
var palettes={
 main:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#A30084",a2:"#B69100",a3:"#00466D",accentText:"#F4F4F1"},
 bau:{bg:"#E9E9E9",panel:"#F3F3F3",text:"#171717",sub:"#737373",a1:"#C94A3F",a2:"#315A9F",a3:"#9A7226",accentText:"#F2F2EF"},
 mist:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#94CDC2",a2:"#C9C3AE",a3:"#8F7C9A",accentText:"#F4F4F1"}
};
var currentPalette="main";
var gesture=null;

function setPage(n,animate){
 page=Math.max(0,Math.min(3,n));
 track.style.transition=animate===false?"none":"transform .23s cubic-bezier(.2,.8,.2,1)";
 track.style.transform="translate3d(-"+(page*25)+"%,0,0)";
 title.textContent=titles[page];
 var buttons=document.querySelectorAll("[data-page]");
 for(var i=0;i<buttons.length;i++)buttons[i].classList.toggle("active",i===page);
}
var nav=document.querySelectorAll("[data-page]");
for(var i=0;i<nav.length;i++){(function(index){nav[index].addEventListener("click",function(){setPage(index,true)})})(i)}

viewport.addEventListener("touchstart",function(e){
 if(e.touches.length!==1)return;
 if(e.target.closest("input,button,.editor"))return;
 var t=e.touches[0];gesture={x:t.clientX,y:t.clientY,dx:0,dy:0,axis:"",start:page};
 track.style.transition="none";
},{passive:true});
viewport.addEventListener("touchmove",function(e){
 if(!gesture||e.touches.length!==1)return;
 var t=e.touches[0];gesture.dx=t.clientX-gesture.x;gesture.dy=t.clientY-gesture.y;
 if(!gesture.axis&&(Math.abs(gesture.dx)>8||Math.abs(gesture.dy)>8))gesture.axis=Math.abs(gesture.dx)>Math.abs(gesture.dy)*1.15?"x":"y";
 if(gesture.axis==="x"){
   var dx=gesture.dx;if((page===0&&dx>0)||(page===3&&dx<0))dx*=.28;
   track.style.transform="translate3d("+(-page*viewport.clientWidth+dx)+"px,0,0)";
 }
},{passive:true});
viewport.addEventListener("touchend",function(){
 if(!gesture)return;var g=gesture;gesture=null;
 if(g.axis==="x"&&Math.abs(g.dx)>55)setPage(g.start+(g.dx<0?1:-1),true);else setPage(g.start,true);
},{passive:true});

var cards=document.querySelectorAll("[data-today]");
function updateProgress(){var done=0;for(var i=0;i<cards.length;i++)if(cards[i].classList.contains("done"))done++;document.getElementById("count").textContent=done+" / 3";document.getElementById("bar").style.width=(done/3*100)+"%"}
for(var c=0;c<cards.length;c++){cards[c].addEventListener("click",function(){this.classList.toggle("done");var check=this.querySelector(".check");check.textContent=this.classList.contains("done")?"✓":"";updateProgress()})}

var toggles=document.querySelectorAll(".toggle");
for(var j=0;j<toggles.length;j++){toggles[j].addEventListener("click",function(){this.classList.toggle("off");this.textContent=this.classList.contains("off")?"OFF":"ON"})}

function applyPalette(p){
 var keys=Object.keys(p);for(var i=0;i<keys.length;i++)document.documentElement.style.setProperty("--"+keys[i],p[keys[i]]);
}
var paletteButtons=document.querySelectorAll("[data-palette]");
for(var k=0;k<paletteButtons.length;k++){(function(btn){
 function choose(e){if(e)e.preventDefault();currentPalette=btn.getAttribute("data-palette");applyPalette(palettes[currentPalette]);openEditor(JSON.parse(JSON.stringify(palettes[currentPalette])));}
 btn.addEventListener("click",choose);
 btn.addEventListener("touchend",choose,{passive:false});
})(paletteButtons[k])}

function openEditor(p){
 document.getElementById("editor").classList.add("show");
 var rows=document.getElementById("editRows");rows.innerHTML="";
 var labels={bg:"Background",panel:"Panel / Cell",text:"Primary Text",sub:"Secondary Text",a1:"Accent 1",a2:"Accent 2",a3:"Accent 3",accentText:"Accent Text"};
 var keys=Object.keys(labels);
 for(var i=0;i<keys.length;i++){(function(key){
   var r=document.createElement("div");r.className="editRow";
   r.innerHTML="<label>"+labels[key]+"</label><input type='color' value='"+p[key]+"'><input type='text' value='"+p[key]+"'>";
   var pick=r.children[1],hex=r.children[2];
   pick.addEventListener("input",function(){p[key]=pick.value.toUpperCase();hex.value=p[key];applyPalette(p);renderPreview(p)});
   hex.addEventListener("change",function(){var v=hex.value.trim();if(v.charAt(0)!=="#")v="#"+v;if(/^#[0-9A-Fa-f]{6}$/.test(v)){p[key]=v.toUpperCase();pick.value=v;applyPalette(p);renderPreview(p)}else hex.value=p[key]});
   rows.appendChild(r);
 })(keys[i])}
 renderPreview(p);
}
function renderPreview(p){document.getElementById("preview").innerHTML="<div style='background:"+p.bg+"'></div><div style='background:"+p.a1+"'></div><div style='background:"+p.a2+"'></div><div style='background:"+p.a3+"'></div>"}
document.getElementById("newPalette").addEventListener("click",function(){openEditor(JSON.parse(JSON.stringify(palettes[currentPalette])))});
document.getElementById("savePalette").addEventListener("click",function(){alert("カスタムパレット保存は次段階で追加します。")});

function bindHold(el,center){
 var timer=null,sx=0,sy=0,moved=false,committed=false;
 function clearVisual(){el.classList.remove("holdIn","holdOut")}
 el.addEventListener("touchstart",function(e){
   if(e.touches.length!==1)return;
   var t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false;committed=false;
   el.classList.add(center?"holdOut":"holdIn");
   clearTimeout(timer);
   timer=setTimeout(function(){
     if(moved)return;
     committed=true;
     if(center){
       clearVisual();
     }else{
       el.classList.add("holdIn");
       setTimeout(clearVisual,180);
     }
   },430);
 },{passive:true});
 el.addEventListener("touchmove",function(e){
   if(!e.touches.length)return;
   var t=e.touches[0];
   if(Math.hypot(t.clientX-sx,t.clientY-sy)>12){
     moved=true;clearTimeout(timer);clearVisual();
   }
 },{passive:true});
 el.addEventListener("touchend",function(){
   clearTimeout(timer);
   if(!committed)clearVisual();
   setTimeout(function(){committed=false;clearVisual()},220);
 },{passive:true});
 el.addEventListener("touchcancel",function(){clearTimeout(timer);clearVisual()},{passive:true});
}
var deep=document.querySelectorAll("[data-deep]");for(var q=0;q<deep.length;q++)bindHold(deep[q],false);bindHold(document.getElementById("centerCell"),true);

setPage(0,false);applyPalette(palettes.main);
})();
</script>
</body>
</html>
