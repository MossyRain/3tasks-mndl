<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E7E8E8">
<title>3TASKS MNDL Safari v2.9</title>
<style>
:root{
  --bg:#E7E8E8;--panel:#F4F4F3;--text:#202120;--sub:#747675;
  --a1:#A30084;--a2:#B69100;--a3:#00466D;--accentText:#F4F4F1;
  --off:#D6D7D6;--done:#D0D1D0;
  --safeTop:env(safe-area-inset-top,0px);--safeBottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
.app{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.header{position:absolute;top:var(--safeTop);left:0;right:0;height:104px;padding:18px;background:var(--bg);z-index:5}
.date{font-size:11px;letter-spacing:.13em;color:var(--sub)}
.title{margin-top:4px;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.045em}
.viewport{position:absolute;left:0;right:0;top:calc(var(--safeTop) + 104px);bottom:calc(var(--safeBottom) + 84px);overflow:hidden}
.track{width:400%;height:100%;display:flex;transform:translate3d(0,0,0);transition:transform .23s cubic-bezier(.2,.8,.2,1);will-change:transform}
.page{width:25%;flex:0 0 25%;height:100%;padding:0 18px;overflow:hidden;min-width:0}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
.footer{position:absolute;left:18px;right:18px;bottom:calc(var(--safeBottom) + 20px);height:64px;background:var(--bg);border-top:1px solid rgba(32,33,32,.12);display:flex;align-items:center;justify-content:center;gap:22px;z-index:6}
.footer button{border:0;background:none;padding:10px 0;min-height:44px;font-size:10px;font-weight:760;color:var(--sub)}
.footer button.active{color:var(--text)}.gear{font-size:20px}
.appmeta{position:absolute;left:18px;right:18px;bottom:var(--safeBottom);height:20px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:9px;letter-spacing:.08em;z-index:7}
.cards{display:grid;gap:4px}
.card{min-height:104px;border:0;border-radius:12px;padding:15px 12px 15px 14px;display:grid;grid-template-columns:44px 1fr 78px;gap:9px;align-items:center;text-align:left;color:var(--accentText);position:relative}
.card.c1{background:var(--a1)}.card.c2{background:var(--a2)}.card.c3{background:var(--a3)}.card.done{background:var(--done);color:var(--text)}
.cardRight{display:grid;grid-template-rows:28px 28px;gap:8px;align-items:center}
.refreshPlain{width:28px;height:28px;border:0;background:transparent;color:inherit;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}
.refreshPlain.used{opacity:.24;pointer-events:none}
.doneAction{border:0;background:transparent;color:inherit;padding:0;display:grid;grid-template-columns:28px auto;gap:7px;align-items:center;font-size:10px;font-weight:800;letter-spacing:.06em}
.doneCircle{width:28px;height:28px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.card.emptyCard{background:var(--panel);color:var(--text)}
.emptyCopy{font-size:14px;font-weight:650;line-height:1.35}
.emptyCard .refreshPlain{color:var(--sub)}
.card.c1{background:var(--a1)}.card.c2{background:var(--a2)}.card.c3{background:var(--a3)}.card.done{background:var(--done);color:var(--text)}
.num{font-size:28px;font-weight:780}.taskName{font-size:16px;font-weight:730}.trail{font-size:10px;margin-top:5px;opacity:.76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:27px;height:27px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center}
.progress{height:4px;background:rgba(32,33,32,.12);border-radius:999px;margin-top:13px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--text)}.progressText{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--sub)}
.breadcrumb{min-height:28px;display:flex;gap:7px;align-items:center;overflow-x:auto;white-space:nowrap;margin-bottom:9px;font-size:11px;color:var(--sub)}
.breadcrumb button{border:0;background:none;padding:5px 0;color:inherit}
.mandalaWrap{position:relative;width:100%;aspect-ratio:1/1}
.mandala{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transition:transform .42s cubic-bezier(.18,.82,.2,1),opacity .22s ease}
.cell{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:3px;background:var(--panel);padding:7px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;transition:transform .18s ease,opacity .18s ease,color .42s linear}
.cell:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3));transition:opacity .42s linear}
.cell.center{color:var(--accentText)}.cell.center:before{opacity:1}.cell.holdIn,.cell.center.holdOut{transform:scale(.98)}
.cell.empty{font-size:22px;color:#A7A8A7;font-weight:400}.cell.empty:before{display:none}
.deep{position:absolute;right:5px;bottom:4px;opacity:.4}.hint{font-size:10px;color:var(--sub);margin-top:9px}
.ghost{position:absolute;z-index:20;border-radius:3px;background:var(--panel);display:grid;place-items:center;text-align:center;padding:7px;font-size:13px;font-weight:690;overflow:hidden;isolation:isolate;pointer-events:none;transition:left .42s cubic-bezier(.18,.82,.2,1),top .42s cubic-bezier(.18,.82,.2,1),width .42s cubic-bezier(.18,.82,.2,1),height .42s cubic-bezier(.18,.82,.2,1),opacity .16s ease}
.ghost.center:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.actions{display:grid;gap:4px}.action{background:var(--panel);border-radius:8px;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.actionCopy{min-width:0}.actionName{font-size:14px;font-weight:710}.actionTrail{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{border:0;border-radius:999px;min-width:48px;padding:8px 11px;font-size:10px;font-weight:800;color:var(--accentText);background:radial-gradient(circle at 5% 15%,var(--a1) 0 20%,transparent 54%),radial-gradient(circle at 95% 15%,var(--a2) 0 20%,transparent 54%),radial-gradient(circle at 50% 115%,var(--a3) 0 28%,transparent 62%),linear-gradient(135deg,var(--a1),var(--a2) 50%,var(--a3))}
.toggle.off{background:var(--off);color:#555}
.section{background:var(--panel);border-radius:12px;padding:13px;margin-bottom:8px}.section h2{margin:0 0 10px;font-size:11px;letter-spacing:.09em}
.paletteRow{width:100%;border:0;border-top:1px solid rgba(32,33,32,.09);background:none;min-height:53px;padding:9px 0;display:flex;align-items:center;justify-content:space-between;text-align:left}.paletteRow:first-of-type{border-top:0}.paletteName{font-size:13px;font-weight:720}.tag{font-size:9px;color:var(--sub);margin-left:6px}.dots{display:flex;gap:3px}.dots i{display:block;width:20px;height:20px;border-radius:5px}
.btn{border:0;border-radius:9px;padding:10px 12px;background:#D8D9D8;color:#202120;font-size:11px;font-weight:720;min-height:42px}.btn.primary{background:#171817;color:#fff}.btn.danger{color:#9B352F}.btn:disabled{opacity:.35}
.editor{display:none}.editor.show{display:block}.preview{height:52px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3px;margin:8px 0 10px}.preview div{border-radius:7px}.editRow{display:grid;grid-template-columns:1fr 44px 84px;gap:7px;align-items:center;padding:6px 0}.editRow label{font-size:11px}.editRow input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}.editRow input[type=text]{width:84px;border:0;border-radius:8px;background:var(--bg);padding:8px;font-size:11px}
.dataActions{display:flex;gap:6px;flex-wrap:wrap}.dataNote{font-size:10px;color:var(--sub);line-height:1.5;margin-top:8px}.fileInput{display:none}
.editSheet{position:absolute;left:18px;right:18px;bottom:calc(var(--safeBottom) + 104px);background:var(--panel);border-radius:14px;padding:14px;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.16);display:none}
.editSheet.show{display:block}.editTitle{font-size:14px;font-weight:760;margin-bottom:6px}.editTrail{font-size:10px;color:var(--sub);margin-bottom:10px}.editInput{width:100%;border:0;border-radius:9px;background:var(--bg);padding:11px;font-size:16px}.editActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.editBackdrop{position:absolute;inset:0;z-index:29;background:transparent;display:none}
.editBackdrop.show{display:block}
.editSheet{transition:opacity .14s ease,transform .14s ease}
.editSheet.hiddenBySwipe{opacity:0;transform:translateY(8px);pointer-events:none}
.moveSelect{width:100%;border:0;border-radius:9px;background:var(--bg);padding:11px;font-size:14px;margin-top:8px}
.movePanel{display:none;margin-top:10px}.movePanel.show{display:block}
.motionLayer{position:absolute;inset:0;pointer-events:none;z-index:19;overflow:visible}
.zoomClone{position:absolute;border-radius:3px;background:var(--panel);display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;padding:7px;overflow:hidden;isolation:isolate;transition:left .46s cubic-bezier(.18,.82,.2,1),top .46s cubic-bezier(.18,.82,.2,1),width .46s cubic-bezier(.18,.82,.2,1),height .46s cubic-bezier(.18,.82,.2,1),transform .46s cubic-bezier(.18,.82,.2,1),opacity .28s ease}
.zoomClone.centerLike{color:var(--accentText)}
.zoomClone.centerLike:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.parentIncoming{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;opacity:0;transform:scale(1.32);transition:transform .44s cubic-bezier(.18,.82,.2,1),opacity .18s ease}
.parentIncoming.show{opacity:1;transform:scale(1)}
.childOutgoing{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transition:transform .44s cubic-bezier(.18,.82,.2,1),opacity .18s ease}
.mandala.fadeInFinal{animation:fadeInFinal .20s ease both}
@keyframes fadeInFinal{from{opacity:0}to{opacity:1}}
.zoomClone.fadeOutFinal,.childOutgoing.fadeOutFinal,.parentIncoming.fadeOutFinal{opacity:0!important}


.paletteGroupTitle{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--sub);margin:3px 0 7px}
.swatchPreview{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.swatchPreview.basePreview{grid-template-columns:repeat(3,1fr)}
.swatchBtn{height:46px;border:0;border-radius:8px;position:relative;overflow:hidden;padding:0}
.swatchBtn span{position:absolute;left:6px;bottom:5px;font-size:8px;font-weight:750;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.swatchBtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.selectedColorEditor{margin-top:10px;padding-top:10px;border-top:1px solid rgba(32,33,32,.10)}.selectedColorLabel{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--sub);margin-bottom:7px}.selectedColorControls{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center}.selectedColorControls input[type=color]{width:54px;height:42px;border:0;background:none;padding:0}.selectedColorControls input[type=text]{border:0;border-radius:8px;background:var(--bg);padding:10px;font-size:12px;text-transform:uppercase}
.cameraOverlay{position:absolute;inset:0;z-index:23;pointer-events:none;overflow:hidden}
.cameraGrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transform-origin:0 0;will-change:transform,opacity;transition:transform .72s cubic-bezier(.18,.78,.18,1),opacity .34s ease}
.cameraGrid .cell{pointer-events:none}


.swatchBtn{height:58px;border:0;border-radius:8px;position:relative;overflow:hidden;padding:0;text-align:left}
.swatchBtn .swatchName{position:absolute;left:7px;top:6px;font-size:8px;font-weight:760}
.swatchBtn .swatchHex{position:absolute;left:7px;bottom:6px;font-size:9px;font-weight:700;letter-spacing:.02em}
.colorWorkbench{margin-top:11px;padding-top:10px;border-top:1px solid rgba(32,33,32,.10)}
.colorModeTabs{display:flex;gap:14px;margin-bottom:10px}
.colorMode{border:0;background:none;padding:5px 0;color:var(--sub);font-size:10px;font-weight:800;letter-spacing:.08em}
.colorMode.active{color:var(--text)}
.colorModePanel{min-height:110px}
.colorGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.gridColor{aspect-ratio:1;border:0;border-radius:6px}
.spectrumRow,.sliderLine{display:grid;grid-template-columns:66px 1fr 40px;gap:8px;align-items:center;margin:9px 0}
.spectrumRow label,.sliderLine label,.sliderLine output{font-size:10px;color:var(--sub)}
.sliderLine output{text-align:right}
.colorRange{width:100%}
.hexReadout{margin-top:9px;display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center}
.hexReadout .chip{height:38px;border-radius:8px}
.hexInput{border:0;border-radius:8px;background:var(--bg);padding:10px;font-size:12px;text-transform:uppercase}


.depthWorld{position:absolute;inset:0;z-index:25;pointer-events:none;transform-origin:0 0;will-change:transform,opacity}
.depthGrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.depthCell{position:relative;border-radius:3px;background:var(--panel);display:grid;place-items:center;text-align:center;padding:7px;font-size:13px;font-weight:690;overflow:hidden;isolation:isolate}
.depthCell.center{color:var(--accentText)}
.depthCell.center:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.depthCell.empty{font-size:22px;color:#A7A8A7;font-weight:400}
.depthNested{position:absolute;overflow:hidden;border-radius:3px}
.spectrumPanel{position:relative;width:100%;height:180px;border-radius:10px;overflow:hidden;touch-action:none;background:#f00;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.spectrumWhite{position:absolute;inset:0;background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
.spectrumBlack{position:absolute;inset:0;background:linear-gradient(to top,#000,rgba(0,0,0,0))}
.spectrumCursor{position:absolute;width:18px;height:18px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none}
.hueStrip{width:100%;height:18px;border-radius:9px;margin-top:10px;appearance:none;-webkit-appearance:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.hueStrip::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #333}


.depthWorld .depthGrid{transform-origin:0 0}
.depthWorld.fadeDepth{opacity:1}
.depthWorld.fadeDepth .depthCell{transition:opacity .22s ease}
.depthWorld.fadeDepth .depthCell.center{color:var(--accentText)}
.depthWorld.fadeDepth .depthCell.center:before{opacity:1}


.zoomFixedLabel{position:absolute;z-index:30;pointer-events:none;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;color:var(--text)}
.zoomFixedLabel.onAccent{color:var(--accentText)}

</style>
</head>
<body>
<div class="app">
<header class="header"><div class="date">SAT 22 AUG</div><div class="title" id="title">TODAY</div></header>
<div class="viewport" id="viewport"><div class="track" id="track">

<section class="page"><div class="scroll">
<div class="cards" id="cards"></div>
<div class="progress"><i id="bar"></i></div><div class="progressText"><span>今日の進捗</span><span id="count">0 / 3</span></div>
</div></section>

<section class="page"><div class="scroll">
<div class="breadcrumb" id="breadcrumb"></div>
<div class="mandalaWrap" id="mandalaWrap"><div class="mandala" id="mandala"></div><div class="motionLayer" id="motionLayer"></div><div class="cameraOverlay" id="cameraOverlay"></div></div>
<div class="hint">タップ：EDIT CELL ／ 長押し：9マス全体へ拡大して深掘り ／ 中央長押し：親セル位置へ縮小して戻る</div>
</div></section>

<section class="page"><div class="scroll"><div class="actions" id="actions"></div></div></section>

<section class="page"><div class="scroll">
<div class="section"><h2>COLOR PALETTE</h2><div id="paletteList"></div><button class="btn" id="newPalette">＋ NEW PALETTE</button></div>
<div class="section"><h2>BACKGROUND</h2>
<div class="dataActions">
<button class="btn" data-bgmode="white">WHITE</button>
<button class="btn" data-bgmode="black">BLACK</button>
<button class="btn" data-bgmode="custom" id="customBgBtn">CUSTOM</button>
</div>
<div id="customBgEditor" style="display:none;margin-top:10px"></div>
</div>
<div class="section editor" id="editor">
<h2 id="editorTitle">EDIT PALETTE</h2>
<div class="paletteGroupTitle">ACCENT COLORS</div>
<div class="swatchPreview" id="accentPreview"></div>
<div class="paletteGroupTitle" style="margin-top:14px">BASE COLORS</div>
<div class="swatchPreview basePreview" id="basePreview"></div>
<div class="colorWorkbench" id="colorWorkbench">
  <div class="colorModeTabs">
    <button type="button" class="colorMode active" data-color-mode="grid">GRID</button>
    <button type="button" class="colorMode" data-color-mode="spectrum">SPECTRUM</button>
    <button type="button" class="colorMode" data-color-mode="sliders">SLIDERS</button>
  </div>
  <div id="gridEditor" class="colorModePanel"></div>
  <div id="spectrumEditor" class="colorModePanel" style="display:none"></div>
  <div id="slidersEditor" class="colorModePanel" style="display:none"></div>
</div>
<div class="editActions">
  <button class="btn primary" id="saveAsPalette">新しいパレットとして保存</button>
  <button class="btn" id="overwritePalette">上書き保存</button>
  <button class="btn danger" id="deletePalette">削除</button>
</div>
</div>
</div>
<div class="section"><h2>DATA</h2><div class="dataActions"><button class="btn" id="exportBtn">JSONを書き出す</button><button class="btn" id="importBtn">JSONを読み込む</button><input class="fileInput" id="importFile" type="file" accept="application/json,.json"></div><div class="dataNote">Safari内へ自動保存し、JSONでもバックアップできます。</div></div>
</div></section>

</div></div>

<nav class="footer"><button class="active" data-page="0">TODAY</button><button data-page="1">MANDALA</button><button data-page="2">ACTIONS</button><button data-page="3"><span class="gear">⚙︎</span></button></nav>
<div class="appmeta">3TASKS MNDL · v2.9</div>

<div class="editBackdrop" id="editBackdrop"></div><div class="editSheet" id="editSheet">
  <div class="editTitle">EDIT CELL</div>
  <div class="editTrail" id="editTrail"></div>
  <input class="editInput" id="editInput" type="text" placeholder="項目名">
  <div class="editActions">
    <button class="btn primary" id="editSave">保存</button>
    <button class="btn" id="moveCell">移動</button>
    <button class="btn danger" id="deleteCell">削除</button>
    <button class="btn" id="editClose">閉じる</button>
  </div>
  <div class="movePanel" id="movePanel">
    <select class="moveSelect" id="moveSelect"></select>
    <div class="editActions">
      <button class="btn primary" id="moveApply">ここへ移動</button>
      <button class="btn" id="moveCancel">キャンセル</button>
    </div>
  </div>
</div>
</div>

<script>

(function(){
var STORAGE="mndl-v29";
var track=document.getElementById("track"),viewport=document.getElementById("viewport"),title=document.getElementById("title"),wrap=document.getElementById("mandalaWrap"),motionLayer=document.getElementById("motionLayer"),cameraOverlay=document.getElementById("cameraOverlay");
var page=0,gesture=null,currentNode="life",editingId=null,editingEmptySlot=null,editingPalette=null,busy=false,editVisiblePage=1;

var builtins=[
 {id:"field",name:"FIELD",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#A30084",a2:"#B69100",a3:"#00466D",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},
 {id:"form",name:"FORM",builtIn:true,c:{bg:"#E9E9E9",panel:"#F3F3F3",text:"#171717",sub:"#737373",a1:"#C94A3F",a2:"#315A9F",a3:"#9A7226",accentText:"#F2F2EF",off:"#D3D3D3",done:"#CFCFCF"}},
 {id:"mist",name:"MIST",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#94CDC2",a2:"#C9C3AE",a3:"#8F7C9A",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},

function animateDeeper(source,id){
 if(busy)return;
 busy=true;

 var live=document.getElementById("mandala");
 var sourceRect=rectInWrap(source);
 var scale=wrap.clientWidth/sourceRect.width;
 var wrapCenter={x:wrap.clientWidth/2,y:wrap.clientHeight/2};
 var sourceCenter={x:sourceRect.left+sourceRect.width/2,y:sourceRect.top+sourceRect.height/2};

 // Clone the whole 3x3 field so cell size and gap size keep exactly the same ratio.
 var field=document.createElement("div");
 field.style.position="absolute";
 field.style.inset="0";
 field.style.display="grid";
 field.style.gridTemplateColumns="repeat(3,1fr)";
 field.style.gap="2px";
 field.style.zIndex="24";
 field.style.pointerEvents="none";
 field.style.transformOrigin=sourceCenter.x+"px "+sourceCenter.y+"px";

 Array.from(live.children).forEach(function(c,idx){
   var d=c.cloneNode(true);
   d.classList.remove("holdIn","holdOut");
   // During forward zoom, keep text from visually growing.
   var spans=d.querySelectorAll("span");
   spans.forEach(function(s){s.style.opacity="0"});
   d.style.fontSize="0px";
   field.appendChild(d);
 });
 motionLayer.appendChild(field);

 // Fixed-size label follows the selected cell while the geometry enlarges.
 var label=document.createElement("div");
 label.className="zoomFixedLabel"+(source.classList.contains("center")?" onAccent":"");
 label.textContent=source.textContent.replace("›","");
 label.style.left=sourceRect.left+"px";
 label.style.top=sourceRect.top+"px";
 label.style.width=sourceRect.width+"px";
 label.style.height=sourceRect.height+"px";
 label.style.transformOrigin="center center";
 motionLayer.appendChild(label);

 live.style.opacity="0";

 var tx=wrapCenter.x-sourceCenter.x;
 var ty=wrapCenter.y-sourceCenter.y;

 // Ratio-preserving camera zoom: one uniform scale applied to the entire field.
 var fieldAnim=field.animate([
   {transform:"translate(0px,0px) scale(1)",opacity:1,offset:0},
   {transform:"translate("+(tx*.18)+"px,"+(ty*.18)+"px) scale("+(1+(scale-1)*.18)+")",opacity:1,offset:.32},
   {transform:"translate("+tx+"px,"+ty+"px) scale("+scale+")",opacity:1,offset:1}
 ],{
   duration:620,
   easing:"cubic-bezier(.42,0,1,1)",
   fill:"forwards"
 });

 // Keep the label itself at constant visual size while moving to screen center.
 label.animate([
   {left:sourceRect.left+"px",top:sourceRect.top+"px",width:sourceRect.width+"px",height:sourceRect.height+"px"},
   {left:"0px",top:"0px",width:wrap.clientWidth+"px",height:wrap.clientHeight+"px"}
 ],{
   duration:620,
   easing:"cubic-bezier(.42,0,1,1)",
   fill:"forwards"
 });

 // Crossfade only near arrival.
 setTimeout(function(){
   currentNode=id;
   renderMandala();
   var dest=document.getElementById("mandala");
   dest.style.opacity="0";
   dest.animate([{opacity:0},{opacity:1}],{duration:150,easing:"ease-out",fill:"forwards"});
   field.animate([{opacity:1},{opacity:0}],{duration:150,easing:"ease-out",fill:"forwards"});
   label.animate([{opacity:1},{opacity:0}],{duration:150,easing:"ease-out",fill:"forwards"});
 },520);

   setTimeout(function(){
     field.remove();label.remove();
     var dest=document.getElementById("mandala");
     if(dest)dest.style.opacity="1";
     busy=false;
   },155);

}
function buildDepthGrid(nodeId){

 var n=node(nodeId),slots=[0,1,2,3,"c",4,5,6,7];
 slots.forEach(function(s){
   var d=document.createElement("div");d.className="depthCell";
   if(s==="c"){d.classList.add("center");d.textContent=n.name}
   else{
     var id=n.children[s];
     if(id)d.textContent=node(id).name;
     else{d.classList.add("empty");d.textContent="＋"}
   }
   grid.appendChild(d);
 });

}
function slotIndexForChild(parentId,childId){
 var idx=node(parentId).children.indexOf(childId),map=[0,1,2,3,5,6,7,8];
 return map[idx];
}
function cellRectForSlot(baseRect,slot){
 var gap=2,w=(baseRect.width-gap*2)/3,h=(baseRect.height-gap*2)/3;
 var row=Math.floor(slot/3),col=slot%3;
 return {left:baseRect.left+col*(w+gap),top:baseRect.top+row*(h+gap),width:w,height:h};
}
function buildNestedWorld(targetAncestorId,deepestId){
 var world=document.createElement("div");world.className="depthWorld";
 var rootRect={left:0,top:0,width:wrap.clientWidth,height:wrap.clientHeight};
 var lineage=pathIds(deepestId);
 var start=lineage.indexOf(targetAncestorId);
 var currentContainer=world;
 var currentRect=rootRect;

 for(var i=start;i<lineage.length;i++){
   var nodeId=lineage[i];
   var holder=document.createElement("div");
   holder.style.position="absolute";
   holder.style.left=currentRect.left+"px";
   holder.style.top=currentRect.top+"px";
   holder.style.width=currentRect.width+"px";
   holder.style.height=currentRect.height+"px";
   holder.appendChild(buildDepthGrid(nodeId));
   currentContainer.appendChild(holder);

   if(i<lineage.length-1){
     var childId=lineage[i+1];
     var slot=slotIndexForChild(nodeId,childId);
     currentRect=cellRectForSlot(currentRect,slot);
   }
 }
 return {world:world,deepRect:currentRect};
}
function cameraBackTo(targetId,duration,done){
 var fromId=currentNode;
 var built=buildNestedWorld(targetId,fromId);
 var world=built.world,deepRect=built.deepRect;
 cameraOverlay.appendChild(world);

 var lineage=pathIds(fromId);
 var levels=Math.max(1,(lineage.length-1)-lineage.indexOf(targetId));

 var sx=wrap.clientWidth/deepRect.width;
 var sy=wrap.clientHeight/deepRect.height;
 var startTransform="translate("+(-deepRect.left*sx)+"px,"+(-deepRect.top*sy)+"px) scale("+sx+","+sy+")";

 world.style.transformOrigin="0 0";
 world.style.transform=startTransform;
 world.style.opacity="1";

 // Text belongs to the same 3D plane when pulling away:
 // it starts visually large because of the world scale and shrinks with distance.
 world.querySelectorAll(".depthCell").forEach(function(c){
   c.style.fontSize="13px";
 });

 var accelMs=560;
 var cruisePerExtraLevel=360;
 var totalMs=accelMs+Math.max(0,levels-1)*cruisePerExtraLevel;

 var live=document.getElementById("mandala");
 live.style.opacity="0";

 currentNode=targetId;
 renderMandala();
 var finalGrid=document.getElementById("mandala");
 finalGrid.style.opacity="0";

 var keyframes;
 if(levels===1){
   keyframes=[
     {transform:startTransform,opacity:1,offset:0},
     {transform:"translate(0px,0px) scale(1)",opacity:.10,offset:1}
   ];
 }else{
   var accelOffset=accelMs/totalMs;
   var midScale=Math.max(1.45,sx-(sx-1)*accelOffset);
   keyframes=[
     {transform:startTransform,opacity:1,offset:0},
     {transform:"translate("+(-deepRect.left*midScale)+"px,"+(-deepRect.top*midScale)+"px) scale("+midScale+")",opacity:.72,offset:accelOffset},
     {transform:"translate(0px,0px) scale(1)",opacity:.10,offset:1}
   ];
 }

 var worldAnim=world.animate(keyframes,{
   duration:totalMs,
   easing:levels===1?"cubic-bezier(.42,0,1,1)":"linear",
   fill:"forwards"
 });

 // Fade is tied to distance, but only becomes strong near the target hierarchy.
 var fadeStart=Math.max(0,totalMs-190);
 setTimeout(function(){
   finalGrid.animate([{opacity:0},{opacity:1}],{duration:190,easing:"ease-out",fill:"forwards"});
   world.animate([{opacity:.42},{opacity:0}],{duration:190,easing:"ease-out",fill:"forwards"});
 },fadeStart);

 worldAnim.onfinish=function(){
   setTimeout(function(){
     world.remove();
     finalGrid.style.opacity="1";
     busy=false;
     if(done)done();
   },195);
 };
}

function buildMoveOptions(){

   var n=node(id);
   if(id!==editingId && n.children.length<8 && !isDescendant(editingId,id)){
     var opt=document.createElement("option");opt.value=id;opt.textContent="　".repeat(depth)+n.name;sel.appendChild(opt);
   }
   n.children.forEach(function(ch){walk(ch,depth+1)});

 return false;
}

   timer=setTimeout(function(){if(moved)return;longDone=true;el.classList.remove("holdIn","holdOut");if(isCenter)animateBack();else animateDeeper(el,id)},430);
 }
 function move(e){if(!e.touches.length)return;var t=e.touches[0];if(Math.hypot(t.clientX-sx,t.clientY-sy)>12){moved=true;clearTimeout(timer);el.classList.remove("holdIn","holdOut")}}

}

function palettes(){return builtins.concat(state.customPalettes||[])}
function activePalette(){return palettes().find(function(p){return p.id===state.activePaletteId})||builtins[0]}
var whiteBg={bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",off:"#D6D7D6",done:"#D0D1D0"};
var blackBg={bg:"#181918",panel:"#2C2D2C",text:"#F0F0ED",sub:"#9A9C9A",off:"#4A4B4A",done:"#4F504F"};

function backgroundValues(){
 if(state.backgroundMode==="black")return blackBg;
 if(state.backgroundMode==="custom")return state.customBackground||whiteBg;
 return whiteBg;
}
function applyPalette(p){
 state.activePaletteId=p.id;
 ["a1","a2","a3","accentText"].forEach(function(k){document.documentElement.style.setProperty("--"+k,p.c[k])});
 var bg=backgroundValues();
 Object.keys(bg).forEach(function(k){document.documentElement.style.setProperty("--"+k,bg[k])});
 save();renderBackgroundControls();
}

function renderBackgroundControls(){
 var buttons=document.querySelectorAll("[data-bgmode]");
 buttons.forEach(function(b){
   b.classList.toggle("primary",b.getAttribute("data-bgmode")===state.backgroundMode);
 });
 var ed=document.getElementById("customBgEditor");
 ed.style.display=state.backgroundMode==="custom"?"block":"none";
 if(state.backgroundMode==="custom")renderCustomBackgroundEditor();
}
function renderCustomBackgroundEditor(){
 var ed=document.getElementById("customBgEditor");ed.innerHTML="";
 var labels={bg:"Background",panel:"Panel / Cell",text:"Primary Text",sub:"Secondary Text",off:"OFF",done:"Completed"};
 Object.keys(labels).forEach(function(k){
   var r=document.createElement("div");r.className="editRow";
   r.innerHTML="<label>"+labels[k]+"</label><input type='color' value='"+state.customBackground[k]+"'><input type='text' value='"+state.customBackground[k]+"'>";
   var pick=r.children[1],hex=r.children[2];
   pick.oninput=function(){state.customBackground[k]=pick.value.toUpperCase();hex.value=state.customBackground[k];applyPalette(activePalette())};
   hex.onchange=function(){var v=hex.value.trim();if(v.charAt(0)!=="#")v="#"+v;if(/^#[0-9A-Fa-f]{6}$/.test(v)){state.customBackground[k]=v.toUpperCase();pick.value=v;applyPalette(activePalette())}else hex.value=state.customBackground[k]};
   ed.appendChild(r);
 });
}
document.querySelectorAll("[data-bgmode]").forEach(function(b){
 b.onclick=function(){
   var mode=b.getAttribute("data-bgmode");
   // Built-in palettes expose WHITE/BLACK. Custom palettes also expose CUSTOM.
   var p=activePalette();
   if(mode==="custom" && p.builtIn)return;
   state.backgroundMode=mode;
   applyPalette(p);
 };
});

function renderPaletteList(){
 var box=document.getElementById("paletteList");box.innerHTML="";
 var cb=document.getElementById("customBgBtn");if(cb)cb.disabled=activePalette().builtIn;
 palettes().forEach(function(p){var b=document.createElement("button");b.className="paletteRow";b.innerHTML="<span><span class='paletteName'>"+p.name+"</span><span class='tag'>"+(p.builtIn?"DEFAULT":"CUSTOM")+"</span></span><span class='dots'><i style='background:"+p.c.a1+"'></i><i style='background:"+p.c.a2+"'></i><i style='background:"+p.c.a3+"'></i></span>";b.onclick=function(){if(p.builtIn&&state.backgroundMode==="custom")state.backgroundMode="white";applyPalette(p);openPaletteEditor(p);renderPaletteList()};box.appendChild(b)});
}
var accentLabels={a1:"Accent 1",a2:"Accent 2",a3:"Accent 3",accentText:"Accent Text"};
var baseLabels={bg:"Background",panel:"Panel / Cell",text:"Primary Text",sub:"Secondary Text",off:"OFF",done:"Completed"};
var selectedColorKey="a1";
var colorMode="grid";
var spectrumHue=0;

function openPaletteEditor(p){
 editingPalette={id:p.id,name:p.name,builtIn:p.builtIn,c:Object.assign({},p.c)};
 var bg=backgroundValues();Object.keys(bg).forEach(function(k){editingPalette.c[k]=bg[k]});
 selectedColorKey="a1";
 spectrumHue=hexToHsl(editingPalette.c[selectedColorKey])[0];
 document.getElementById("editor").classList.add("show");
 document.getElementById("editorTitle").textContent="EDIT · "+p.name;
 renderPaletteEditor();
}
function luminanceText(hex){
 var h=hex.replace("#",""),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
 return (0.2126*r+0.7152*g+0.0722*b)>150?"#171717":"#F5F5F2";
}
function makeSwatch(k,label,container){
 var b=document.createElement("button");b.type="button";b.className="swatchBtn";b.dataset.colorKey=k;
 b.style.background=editingPalette.c[k];b.style.color=luminanceText(editingPalette.c[k]);
 b.innerHTML="<span class='swatchName'>"+label+"</span><span class='swatchHex'>"+editingPalette.c[k]+"</span>";
 b.onclick=function(){
   selectedColorKey=k;
   spectrumHue=hexToHsl(editingPalette.c[selectedColorKey])[0];
   highlightSelectedSwatches();
   renderColorWorkbench();
 };
 container.appendChild(b);
}
function highlightSelectedSwatches(){
 document.querySelectorAll(".swatchBtn").forEach(function(b){
   b.style.outline=b.dataset.colorKey===selectedColorKey?"2px solid var(--text)":"none";
   b.style.outlineOffset=b.dataset.colorKey===selectedColorKey?"2px":"0";
 });
}
function renderPaletteEditor(){
 var aPrev=document.getElementById("accentPreview"),bPrev=document.getElementById("basePreview");
 aPrev.innerHTML="";bPrev.innerHTML="";
 Object.keys(accentLabels).forEach(function(k){makeSwatch(k,accentLabels[k],aPrev)});
 Object.keys(baseLabels).forEach(function(k){makeSwatch(k,baseLabels[k],bPrev)});
 document.getElementById("overwritePalette").style.display=editingPalette.builtIn?"none":"inline-block";
 document.getElementById("deletePalette").style.display=editingPalette.builtIn?"none":"inline-block";
 highlightSelectedSwatches();previewPalette();renderColorWorkbench();
}
function refreshSwatchesOnly(){
 document.querySelectorAll(".swatchBtn").forEach(function(b){
   var k=b.dataset.colorKey;
   if(!k)return;
   b.style.background=editingPalette.c[k];
   b.style.color=luminanceText(editingPalette.c[k]);
   var hex=b.querySelector(".swatchHex");if(hex)hex.textContent=editingPalette.c[k];
 });
}
function previewPalette(){
 Object.keys(editingPalette.c).forEach(function(k){document.documentElement.style.setProperty("--"+k,editingPalette.c[k])});
 refreshSwatchesOnly();
}
function hexToHsl(hex){
 var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 var max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,s=0,l=(max+min)/2;
 if(max!==min){var d=max-min;s=l>.5?d/(2-max-min):d/(max+min);if(max===r)h=(g-b)/d+(g<b?6:0);else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}
 return [h,s*100,l*100];
}
function hslToHex(h,s,l){
 h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;
 var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
 if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
 return "#"+[r,g,b].map(function(v){return Math.round((v+m)*255).toString(16).padStart(2,"0")}).join("").toUpperCase();
}
function setSelectedColor(v,rerenderWorkbench){
 editingPalette.c[selectedColorKey]=v.toUpperCase();
 previewPalette();
 if(rerenderWorkbench!==false)renderColorWorkbench();
}
function renderGridMode(){
 var box=document.getElementById("gridEditor");box.innerHTML="";
 // Deliberately matrix-like: neutral row + hue families.
 var colors=[
 "#000000","#333333","#666666","#999999","#CCCCCC","#E7E8E8","#F4F4F3","#FFFFFF",
 "#7C1D1D","#A33A2B","#C94A3F","#E57A68","#7A441D","#A86428","#C98A42","#E0B06D",
 "#7A6816","#9A7226","#B69100","#D0B52D","#477126","#63963B","#86B75D","#B0D083",
 "#176F64","#2B9182","#65B6A8","#94CDC2","#174B70","#315A9F","#4D7FB9","#86A9CF",
 "#352A80","#5046A4","#7067C2","#9993D4","#682267","#8B347D","#A30084","#C55DAA",
 "#70495D","#8F6279","#B18099","#D0A9BA","#6C6153","#91846D","#C9C3AE","#E2DDCE"
 ];
 colors.forEach(function(c){var b=document.createElement("button");b.className="gridColor";b.style.background=c;b.onclick=function(){setSelectedColor(c)};box.appendChild(b)});
}
function renderSpectrumMode(){
 var box=document.getElementById("spectrumEditor"),hsl=hexToHsl(editingPalette.c[selectedColorKey]);
 spectrumHue=isFinite(spectrumHue)?spectrumHue:hsl[0];
 box.innerHTML="<div class='spectrumPanel' id='spectrumPanel'><div class='spectrumWhite'></div><div class='spectrumBlack'></div><div class='spectrumCursor' id='spectrumCursor'></div></div><input class='hueStrip' id='hueStrip' type='range' min='0' max='360' value='"+Math.round(spectrumHue)+"'>";
 var panel=document.getElementById("spectrumPanel"),cursor=document.getElementById("spectrumCursor"),hue=document.getElementById("hueStrip");
 function setHueBackground(){panel.style.background="hsl("+spectrumHue+",100%,50%)"}
 function setCursorFromColor(){
   var c=hexToHsl(editingPalette.c[selectedColorKey]);
   var x=c[1]/100*panel.clientWidth;
   var y=(1-c[2]/100)*panel.clientHeight;
   cursor.style.left=Math.max(0,Math.min(panel.clientWidth,x))+"px";
   cursor.style.top=Math.max(0,Math.min(panel.clientHeight,y))+"px";
 }
 function pickAt(clientX,clientY){
   var r=panel.getBoundingClientRect();
   var x=Math.max(0,Math.min(r.width,clientX-r.left));
   var y=Math.max(0,Math.min(r.height,clientY-r.top));
   var s=x/r.width*100;
   // panel's black overlay makes vertical coordinate closer to lightness-like control
   var l=(1-y/r.height)*100;
   setSelectedColor(hslToHex(spectrumHue,s,l),false);
   cursor.style.left=x+"px";cursor.style.top=y+"px";
 }
 panel.addEventListener("pointerdown",function(e){panel.setPointerCapture(e.pointerId);pickAt(e.clientX,e.clientY)});
 panel.addEventListener("pointermove",function(e){if(e.buttons)pickAt(e.clientX,e.clientY)});
 hue.oninput=function(){spectrumHue=+this.value;setHueBackground();var c=hexToHsl(editingPalette.c[selectedColorKey]);setSelectedColor(hslToHex(spectrumHue,c[1],c[2]),false)};
 setHueBackground();setTimeout(setCursorFromColor,0);
}
function sliderHTML(label,id,min,max,val){
 return "<div class='sliderLine'><label>"+label+"</label><input class='colorRange' id='"+id+"' type='range' min='"+min+"' max='"+max+"' value='"+val+"'><output>"+Math.round(val)+"</output></div>";
}
function renderSlidersMode(){
 var hsl=hexToHsl(editingPalette.c[selectedColorKey]),box=document.getElementById("slidersEditor");
 box.innerHTML=sliderHTML("H","slideH",0,360,hsl[0])+sliderHTML("S","slideS",0,100,hsl[1])+sliderHTML("L","slideL",0,100,hsl[2])+
 "<div class='hexReadout'><div class='chip' style='background:"+editingPalette.c[selectedColorKey]+"'></div><input class='hexInput' id='slideHex' value='"+editingPalette.c[selectedColorKey]+"'></div>";
 ["slideH","slideS","slideL"].forEach(function(id){document.getElementById(id).oninput=function(){this.nextElementSibling.value=Math.round(this.value);var v=hslToHex(+document.getElementById("slideH").value,+document.getElementById("slideS").value,+document.getElementById("slideL").value);editingPalette.c[selectedColorKey]=v;previewPalette();document.getElementById("slideHex").value=v}});
 document.getElementById("slideHex").onchange=function(){var v=this.value.trim();if(v.charAt(0)!=="#")v="#"+v;if(/^#[0-9A-Fa-f]{6}$/.test(v))setSelectedColor(v)};
}
function renderColorWorkbench(){
 document.querySelectorAll(".colorMode").forEach(function(b){b.classList.toggle("active",b.dataset.colorMode===colorMode)});
 document.getElementById("gridEditor").style.display=colorMode==="grid"?"block":"none";
 document.getElementById("spectrumEditor").style.display=colorMode==="spectrum"?"block":"none";
 document.getElementById("slidersEditor").style.display=colorMode==="sliders"?"block":"none";
 if(colorMode==="grid")renderGridMode();
 if(colorMode==="spectrum")renderSpectrumMode();
 if(colorMode==="sliders")renderSlidersMode();
}
document.querySelectorAll(".colorMode").forEach(function(b){b.onclick=function(){colorMode=b.dataset.colorMode;renderColorWorkbench()}});

document.getElementById("newPalette").onclick=function(){
 var p=activePalette(),c=Object.assign({},p.c),bg=backgroundValues();Object.keys(bg).forEach(function(k){c[k]=bg[k]});
 editingPalette={id:"c"+Date.now(),name:"MY PALETTE "+(state.customPalettes.length+1),builtIn:false,c:c};
 document.getElementById("editor").classList.add("show");document.getElementById("editorTitle").textContent="NEW PALETTE";renderPaletteEditor();
};
document.getElementById("saveAsPalette").onclick=function(){
 var p={id:"c"+Date.now(),name:editingPalette.builtIn?editingPalette.name+" CUSTOM":editingPalette.name+" COPY",builtIn:false,c:Object.assign({},editingPalette.c)};
 state.customPalettes.push(p);
 state.customBackground={bg:editingPalette.c.bg,panel:editingPalette.c.panel,text:editingPalette.c.text,sub:editingPalette.c.sub,off:editingPalette.c.off,done:editingPalette.c.done};
 state.backgroundMode="custom";
 applyPalette(p);save();renderPaletteList();renderBackgroundControls();openPaletteEditor(p);
};
document.getElementById("overwritePalette").onclick=function(){
 if(!editingPalette||editingPalette.builtIn)return;
 var i=state.customPalettes.findIndex(function(x){return x.id===editingPalette.id});
 if(i>=0){
   state.customPalettes[i]={id:editingPalette.id,name:editingPalette.name,builtIn:false,c:Object.assign({},editingPalette.c)};
   if(state.backgroundMode==="custom")state.customBackground={bg:editingPalette.c.bg,panel:editingPalette.c.panel,text:editingPalette.c.text,sub:editingPalette.c.sub,off:editingPalette.c.off,done:editingPalette.c.done};
   applyPalette(state.customPalettes[i]);save();renderPaletteList();renderBackgroundControls();
 }
};
document.getElementById("deletePalette").onclick=function(){if(!editingPalette||editingPalette.builtIn)return;state.customPalettes=state.customPalettes.filter(function(x){return x.id!==editingPalette.id});document.getElementById("editor").classList.remove("show");applyPalette(builtins[0]);save();renderPaletteList()};

document.getElementById("exportBtn").onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="3tasks-mndl-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)};
document.getElementById("importBtn").onclick=function(){document.getElementById("importFile").click()};
document.getElementById("importFile").onchange=function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.nodes||!x.today)throw new Error();state=x;state.customPalettes=state.customPalettes||[];currentNode="life";save();applyPalette(activePalette());renderAll();alert("復元しました")}catch(err){alert("読み込めないJSONです")}};r.readAsText(file)};

function renderAll(){renderToday();renderActions();renderMandala();renderPaletteList()}
load();
state.customPalettes=state.customPalettes||[];
if(state.activePaletteId==="signal")state.activePaletteId="field";
state.backgroundMode=state.backgroundMode||"white";
state.customBackground=state.customBackground||{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",off:"#D6D7D6",done:"#D0D1D0"};
if(typeof state.manualReselectUsed!=="boolean")state.manualReselectUsed=false;
applyPalette(activePalette());renderAll();renderBackgroundControls();setPage(0,false);
})();

</script>
