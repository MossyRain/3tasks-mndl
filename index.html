.colorHeadButton{width:100%;border:0;background:transparent;padding:0;text-align:left}.colorHeadButton>span:first-child{display:flex;align-items:baseline;gap:6px}.headChev{font-size:14px;color:var(--sub)}.editReset{display:flex;justify-content:flex-end;margin-top:8px}.editTodayRow{display:none;align-items:center;justify-content:space-between;margin-top:10px;padding:8px 2px;border-top:1px solid rgba(127,127,127,.16);border-bottom:1px solid rgba(127,127,127,.16)}.editTodayRow.show{display:flex}.editTodayRow>span{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--sub)}</style>

<body>
<div class="app">
<header class="header"><div class="date" id="todayDate"></div><div class="title" id="title">TODAY</div></header>
<div class="viewport" id="viewport"><div class="track" id="track">

<section class="page"><div class="scroll">
<div class="cards" id="cards"></div>
<div class="progress"><i id="bar"></i></div><div class="progressText"><span>今日の進捗</span><span id="count">0 / 3</span></div>
</div></section>

<section class="page"><div class="scroll">
<div class="breadcrumb" id="breadcrumb"></div>
<div class="mandalaWrap" id="mandalaWrap"><div class="mandala" id="mandala"></div><div class="motionLayer" id="motionLayer"></div><div class="cameraOverlay" id="cameraOverlay"></div></div>
<div class="hint">タップ：EDIT CELL ／ 長押し：9マス全体へ拡大して深掘り ／ 中央長押し：親セル位置へ縮小して戻る</div>
</div></section>

<section class="page"><div class="scroll"><div class="actions" id="actions"></div></div></section>

<section class="page"><div class="scroll">
<div class="section" id="colorSection"><h2>COLOR</h2>

  <div class="colorBlock" id="accentBlock">
    <button type="button" class="colorHead colorHeadButton" id="accentToggle"><span><span class="label">ACCENT COLOR</span><span class="note">（ACCENT 1・2・3）</span></span><span class="headChev" id="accentChev">⌄</span></button>
    <button type="button" class="colorCurrent" id="accentCurrent"></button>
    <div class="colorOptions" id="accentOptions"></div>
    <div class="paletteEditorSheet" id="accentEditorSheet">
      <div class="paletteEditorTop"><strong id="accentEditorTitle">EDIT ACCENT</strong><button type="button" id="accentEditorClose">×</button></div>
      <div class="paletteNameRow"><label>NAME</label><input type="text" id="accentEditName"></div>
      <div id="accentPreview" class="swatchPreview"></div>
      <div class="colorWorkbench">
        <div class="colorModeTabs">
          <button type="button" class="colorMode active" data-color-mode="spectrum">SPECTRUM</button>
          <button type="button" class="colorMode" data-color-mode="sliders">SLIDERS</button>

      </div>
      <div class="editReset"><button type="button" class="btn" id="accentReset">RESET</button></div><div class="editActions" id="accentEditorActions"></div>
    </div>
  </div>

  <div class="colorBlock" id="baseBlock">
    <button type="button" class="colorHead colorHeadButton" id="baseToggle"><span><span class="label">BASE COLOR</span><span class="note">（BG・PANEL・TEXT・SUB…）</span></span><span class="headChev" id="baseChev">⌄</span></button>
    <button type="button" class="colorCurrent" id="baseCurrent"></button>
    <div class="colorOptions" id="baseOptions"></div>
    <div class="paletteEditorSheet" id="baseEditorSheet">
      <div class="paletteEditorTop"><strong id="baseEditorTitle">EDIT BASE</strong><button type="button" id="baseEditorClose">×</button></div>
      <div class="paletteNameRow"><label>NAME</label><input type="text" id="baseEditName"></div>
      <div id="basePreview" class="swatchPreview basePreview"></div>
      <div class="colorWorkbench">
        <div class="colorModeTabs">
          <button type="button" class="colorMode active" data-color-mode="spectrum">SPECTRUM</button>
          <button type="button" class="colorMode" data-color-mode="sliders">SLIDERS</button>
        </div>
        <div id="baseSpectrumEditor" class="colorModePanel"></div>
        <div id="baseSlidersEditor" class="colorModePanel" style="display:none"></div>
      </div>
      <div class="editReset"><button type="button" class="btn" id="baseReset">RESET</button></div><div class="editActions" id="baseEditorActions"></div>
    </div>
  </div>
</div>
</div>

  <div class="dataActions">
    <button class="btn" id="exportBtn">JSONを書き出す</button>
    <button class="btn" id="importBtn">JSONを読み込む</button>

<nav class="footer"><button class="active" data-page="0">TODAY</button><button data-page="1">MANDALA</button><button data-page="2">ACTIONS</button><button data-page="3"><span class="gear">⚙︎</span></button></nav>

<script>

(function(){
var STORAGE="3tasks-mndl-data";
var LEGACY_STORAGE_KEYS=["mndl-v43"];
var track=document.getElementById("track"),viewport=document.getElementById("viewport"),title=document.getElementById("title"),wrap=document.getElementById("mandalaWrap"),motionLayer=document.getElementById("motionLayer"),cameraOverlay=document.getElementById("cameraOverlay");
var page=0,gesture=null,currentNode="life",editingId=null,editingEmptySlot=null,editingPalette=null,busy=false,editVisiblePage=1;

var builtins=[
 {id:"current",name:"CURRENT",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#4A5793",a2:"#37AB91",a3:"#379CB7",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},
 {id:"field",name:"FIELD",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#A30084",a2:"#B69100",a3:"#00466D",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},
 {id:"mist",name:"MIST",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#94CDC2",a2:"#C9C3AE",a3:"#8F7C9A",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},
 {id:"neon",name:"NEON",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#0001F1",a2:"#B2D000",a3:"#F5008B",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}}
];

var defaultNodes={
 life:{id:"life",name:"人生",parent:null,children:["health","learn","create","family","money","play"]},
 health:{id:"health",name:"健康",parent:"life",children:["sleep","food","exercise","rest"]},
 learn:{id:"learn",name:"学び",parent:"life",children:["reading"]},
 create:{id:"create",name:"創作",parent:"life",children:["sketch"]},
 family:{id:"family",name:"家族と過ごす",parent:"life",children:[]},
 money:{id:"money",name:"家計を確認する",parent:"life",children:[]},
 play:{id:"play",name:"新しいことを試す",parent:"life",children:[]},
 sleep:{id:"sleep",name:"睡眠",parent:"health",children:["bed"]},
 food:{id:"food",name:"食事を整える",parent:"health",children:[]},
 exercise:{id:"exercise",name:"運動",parent:"health",children:["bike","squat"]},
 rest:{id:"rest",name:"休息",parent:"health",children:["break10"]},
 reading:{id:"reading",name:"読書",parent:"learn",children:["book10"]},
 sketch:{id:"sketch",name:"造形",parent:"create",children:["sketch1"]},
 bed:{id:"bed",name:"23時までに寝る",parent:"sleep",children:[]},
 bike:{id:"bike",name:"20分自転車に乗る",parent:"exercise",children:[]},
 squat:{id:"squat",name:"スクワット10回",parent:"exercise",children:[]},
 break10:{id:"break10",name:"10分休む",parent:"rest",children:[]},
 book10:{id:"book10",name:"本を10ページ読む",parent:"reading",children:[]},
 sketch1:{id:"sketch1",name:"スケッチを1つ描く",parent:"sketch",children:[]}
};

function renderJapanDate(){
 var parts=new Intl.DateTimeFormat("en-US",{
   timeZone:"Asia/Tokyo",
   weekday:"short",day:"2-digit",month:"short"
 }).formatToParts(new Date());
 var get=function(type){var p=parts.find(function(x){return x.type===type});return p?p.value:""};
 var el=document.getElementById("todayDate");
 if(el)el.textContent=(get("weekday")+" "+get("day")+" "+get("month")).toUpperCase();
}
renderJapanDate();

var state={nodes:JSON.parse(JSON.stringify(defaultNodes)),enabled:{},today:[{id:"bike",tone:1,done:false},{id:"book10",tone:2,done:false},{id:"sketch1",tone:3,done:false}],customPalettes:[],customBases:[],activePaletteId:"current",backgroundMode:"white",customBackground:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"},manualReselectUsed:false,todayDateKey:null,dataVersion:1,appVersion:"5.1"};

function save(){
 try{
   state.dataVersion=1;
   state.appVersion="5.1";
   localStorage.setItem(STORAGE,JSON.stringify(state));
 }catch(e){}
}
function load(){
 try{
   var raw=localStorage.getItem(STORAGE);
   if(!raw){
     for(var i=0;i<LEGACY_STORAGE_KEYS.length;i++){
       var legacy=localStorage.getItem(LEGACY_STORAGE_KEYS[i]);
       if(legacy){raw=legacy;break}
     }
   }
   var s=raw?JSON.parse(raw):null;
   if(s&&s.nodes){
     state=Object.assign(state,s);
     if(state.activePaletteId==="form")state.activePaletteId="current";
     state.dataVersion=1;
     state.appVersion="5.1";
     localStorage.setItem(STORAGE,JSON.stringify(state));
   }
 }catch(e){}
}
function japanDateKey(date){
 var parts=new Intl.DateTimeFormat("en-CA",{
   timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
 }).formatToParts(date||new Date());
 var get=function(t){var p=parts.find(function(x){return x.type===t});return p?p.value:""};
 return get("year")+"-"+get("month")+"-"+get("day");
}
function msUntilJapanMidnight(){
 var now=new Date();
 var parts=new Intl.DateTimeFormat("en-US",{
   timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",
   hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
 }).formatToParts(now);
 var get=function(t){var p=parts.find(function(x){return x.type===t});return +(p?p.value:0)};
 var y=get("year"),m=get("month"),d=get("day");
 var nextJstMidnightUTC=Date.UTC(y,m-1,d+1,0,0,0)-9*60*60*1000;
 return Math.max(1000,nextJstMidnightUTC-now.getTime());
}

function node(id){return state.nodes[id]}
function pathIds(id){var a=[],n=node(id);while(n){a.unshift(n.id);n=n.parent?node(n.parent):null}return a}
function trail(id){return pathIds(id).slice(0,-1).map(function(x){return node(x).name}).join(" ← ")}
function leaves(){return Object.keys(state.nodes).map(function(k){return state.nodes[k]}).filter(function(n){return n.id!=="life"&&n.children.length===0})}

function hideEditForSwipe(){
 var sheet=document.getElementById("editSheet");
 if(sheet.classList.contains("show"))sheet.classList.add("hiddenBySwipe");
}
function restoreEditIfMandala(){
 var sheet=document.getElementById("editSheet");
 if(page===1 && sheet.classList.contains("show"))sheet.classList.remove("hiddenBySwipe");
}
function setPage(n,animate){
 page=Math.max(0,Math.min(3,n));
 track.style.transition=animate===false?"none":"transform .23s cubic-bezier(.2,.8,.2,1)";
 track.style.transform="translate3d(-"+(page*25)+"%,0,0)";
 title.textContent=["TODAY","MANDALA","ACTIONS","SETTINGS"][page];
 var dateEl=document.getElementById("todayDate");
 if(dateEl)dateEl.style.display=page===0?"block":"none";
 var bs=document.querySelectorAll("[data-page]");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("active",i===page);
 if(page===1)restoreEditIfMandala();
}
var nav=document.querySelectorAll("[data-page]");for(var i=0;i<nav.length;i++){(function(idx){nav[idx].onclick=function(){if(idx!==1)hideEditForSwipe();setPage(idx,true)}})(i)}

viewport.addEventListener("touchstart",function(e){
 if(e.touches.length!==1||e.target.closest("input,select,.editor"))return;
 var t=e.touches[0];gesture={x:t.clientX,y:t.clientY,dx:0,dy:0,axis:"",start:page};track.style.transition="none";
},{passive:true});
viewport.addEventListener("touchmove",function(e){
 if(!gesture||e.touches.length!==1)return;var t=e.touches[0];
 gesture.dx=t.clientX-gesture.x;gesture.dy=t.clientY-gesture.y;
 if(!gesture.axis&&(Math.abs(gesture.dx)>8||Math.abs(gesture.dy)>8))gesture.axis=Math.abs(gesture.dx)>Math.abs(gesture.dy)*1.15?"x":"y";
 if(gesture.axis==="x"){
   hideEditForSwipe();
   var dx=gesture.dx;if((page===0&&dx>0)||(page===3&&dx<0))dx*=.28;
   track.style.transform="translate3d("+(-page*viewport.clientWidth+dx)+"px,0,0)";
 }
},{passive:true});
viewport.addEventListener("touchend",function(){
 if(!gesture)return;var g=gesture;gesture=null;
 if(g.axis==="x"&&Math.abs(g.dx)>55)setPage(g.start+(g.dx<0?1:-1),true);else setPage(g.start,true);
},{passive:true});


function enabledLeafIds(){
 return leaves().filter(function(n){return state.enabled[n.id]!==false}).map(function(n){return n.id});
}
function todayIds(exceptIndex){
 return state.today.map(function(t,i){return i===exceptIndex?null:t.id}).filter(Boolean);
}
function chooseTodayReplacement(index){
 var used=todayIds(index);
 var current=state.today[index]&&state.today[index].id;
 var pool=enabledLeafIds().filter(function(id){return used.indexOf(id)<0 && id!==current});
 if(!pool.length)return null;
 return pool[Math.floor(Math.random()*pool.length)];
}
function clearTodayItem(id){
 state.today.forEach(function(t){if(t.id===id){t.id=null;t.done=false}});
}
function reselectToday(index,isReplenishment){
 if(!isReplenishment){
   if(state.manualReselectUsed)return;
   if(!confirm("このタスクを再シャッフルしますか？\n再シャッフルは1回のみ可能です。"))return;
 }
 var id=chooseTodayReplacement(index);
 if(!id){alert("選べる別のタスクがありません。");return}
 state.today[index].id=id;
 state.today[index].done=false;
 if(!isReplenishment)state.manualReselectUsed=true;
 save();renderToday();
}

function shuffleTodayForNewDay(force){
 var key=japanDateKey(new Date());
 if(!force && state.todayDateKey===key)return false;
 var pool=enabledLeafIds().slice();
 for(var i=pool.length-1;i>0;i--){
   var j=Math.floor(Math.random()*(i+1));
   var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;
 }
 state.today=[];
 for(var k=0;k<3;k++)state.today.push({id:pool[k]||null,tone:k+1,done:false});
 state.manualReselectUsed=false;
 state.todayDateKey=key;
 save();
 return true;
}
var midnightTimer=null;
function scheduleJapanMidnightShuffle(){
 if(midnightTimer)clearTimeout(midnightTimer);
 midnightTimer=setTimeout(function(){
   shuffleTodayForNewDay(true);
   renderToday();
   scheduleJapanMidnightShuffle();
 },msUntilJapanMidnight()+250);
}

function renderToday(){
 var box=document.getElementById("cards");box.innerHTML="";
 while(state.today.length<3)state.today.push({id:null,tone:state.today.length+1,done:false});
 state.today=state.today.slice(0,3);

 state.today.forEach(function(t,i){
   var n=t.id?node(t.id):null;
   var valid=n && n.children.length===0 && state.enabled[t.id]!==false;
   if(!valid){t.id=null;t.done=false;n=null}

   var card=document.createElement("div");
   card.className=n?("card c"+t.tone+(t.done?" done":"")):"card emptyCard";

   if(n){
     card.innerHTML=
       "<div class='num'>0"+(i+1)+"</div>"+
       "<div><div class='taskName'>"+n.name+"</div><div class='trail'>"+trail(t.id)+"</div></div>"+
       "<div class='cardRight'>"+
         "<button class='refreshPlain "+(state.manualReselectUsed?"used":"")+"' aria-label='選び直す'>↻</button>"+
         "<button class='doneAction' aria-label='完了'><span>DONE</span><span class='doneCircle'>"+(t.done?"✓":"")+"</span></button>"+
       "</div>";
     card.querySelector(".doneAction").onclick=function(){t.done=!t.done;save();renderToday()};
     card.querySelector(".refreshPlain").onclick=function(){reselectToday(i,false)};
   }else{
     card.innerHTML=
       "<div class='num'>0"+(i+1)+"</div>"+
       "<div class='emptyCopy'>今日の項目がひとつ空きました</div>"+
       "<div class='cardRight'><button class='refreshPlain' aria-label='新しい項目を選ぶ'>↻</button></div>";
     card.querySelector(".refreshPlain").onclick=function(){reselectToday(i,true)};
   }
   box.appendChild(card);
 });
 var d=state.today.filter(function(x){return x.id&&x.done}).length;
 document.getElementById("count").textContent=d+" / 3";
 document.getElementById("bar").style.width=(d/3*100)+"%";
 save();
}
function renderActions(){
 var box=document.getElementById("actions");box.innerHTML="";
 leaves().forEach(function(n){
   var on=state.enabled[n.id]!==false,d=document.createElement("div");d.className="action";
   d.innerHTML="<div class='actionCopy'><div class='actionName'>"+n.name+"</div><div class='actionTrail'>"+trail(n.id)+"</div></div><button class='toggle "+(on?"":"off")+"'>"+(on?"ON":"OFF")+"</button>";
   d.querySelector(".toggle").onclick=function(){
     var next=!on;
     state.enabled[n.id]=next;
     if(!next)clearTodayItem(n.id);
     save();renderActions();renderToday();
   };
   box.appendChild(d);
 });
}
function renderBreadcrumb(){
 var box=document.getElementById("breadcrumb");box.innerHTML="";var ids=pathIds(currentNode);
 ids.forEach(function(id,i){
   var b=document.createElement("button");
   b.textContent=node(id).name;
   b.onclick=function(){
     if(id===currentNode||busy)return;
     animateBackTo(id);
   };
   box.appendChild(b);
   if(i<ids.length-1){
     var s=document.createElement("span");s.textContent="←";box.appendChild(s);
   }
 });
}
function rectInWrap(el){var a=el.getBoundingClientRect(),w=wrap.getBoundingClientRect();return{left:a.left-w.left,top:a.top-w.top,width:a.width,height:a.height}}
function makeCloneFromCell(el,text,center){
 var r=rectInWrap(el),g=document.createElement("div");g.className="zoomClone"+(center?" centerLike":"");g.textContent=text;
 g.style.left=r.left+"px";g.style.top=r.top+"px";g.style.width=r.width+"px";g.style.height=r.height+"px";
 motionLayer.appendChild(g);return{el:g,rect:r};
}
function fullRect(){return{left:0,top:0,width:wrap.clientWidth,height:wrap.clientHeight}}

function animateDeeper(source,id){
 if(busy)return;
 busy=true;

 var live=document.getElementById("mandala");
 var sourceRect=rectInWrap(source);
 var scale=wrap.clientWidth/sourceRect.width;
 var wrapCenter={x:wrap.clientWidth/2,y:wrap.clientHeight/2};
 var sourceCenter={x:sourceRect.left+sourceRect.width/2,y:sourceRect.top+sourceRect.height/2};

 // Clone the whole 3x3 field so cell size and gap size keep exactly the same ratio.
 var field=document.createElement("div");
 field.style.position="absolute";
 field.style.inset="0";
 field.style.display="grid";
 field.style.gridTemplateColumns="repeat(3,1fr)";
 field.style.gap="2px";
 field.style.zIndex="24";
 field.style.pointerEvents="none";
 field.style.transformOrigin=sourceCenter.x+"px "+sourceCenter.y+"px";

 Array.from(live.children).forEach(function(c,idx){
   var d=c.cloneNode(true);
   d.classList.remove("holdIn","holdOut");
   // During forward zoom, keep text from visually growing.
   var spans=d.querySelectorAll("span");
   spans.forEach(function(s){s.style.opacity="0"});
   d.style.fontSize="0px";
   field.appendChild(d);
 });
 motionLayer.appendChild(field);

 // Fixed-size label follows the selected cell while the geometry enlarges.
 var label=document.createElement("div");
 label.className="zoomFixedLabel"+(source.classList.contains("center")?" onAccent":"");
 label.textContent=source.textContent.replace("›","");
 label.style.left=sourceRect.left+"px";
 label.style.top=sourceRect.top+"px";
 label.style.width=sourceRect.width+"px";
 label.style.height=sourceRect.height+"px";
 label.style.transformOrigin="center center";
 motionLayer.appendChild(label);

 live.style.opacity="0";

 var tx=wrapCenter.x-sourceCenter.x;
 var ty=wrapCenter.y-sourceCenter.y;

 // Ratio-preserving camera zoom: one uniform scale applied to the entire field.
 var fieldAnim=field.animate([
   {transform:"translate(0px,0px) scale(1)",opacity:1,offset:0},
   {transform:"translate("+(tx*.10)+"px,"+(ty*.10)+"px) scale("+(1+(scale-1)*.10)+")",opacity:.92,offset:.18},

function buildNestedWorld(targetAncestorId,deepestId){
 var world=document.createElement("div");

 var start=lineage.indexOf(targetAncestorId);

 function appendLevel(nodeId,levelIndex,parentHost){
   var holder=document.createElement("div");
   holder.style.position="absolute";
   holder.style.inset="0";
   holder.style.overflow="hidden";
   holder.appendChild(buildDepthGrid(nodeId));
   parentHost.appendChild(holder);

   if(levelIndex<lineage.length-1){
     var childId=lineage[levelIndex+1];
     var slot=slotIndexForChild(nodeId,childId);

     var gap=2;
     var w=(wrap.clientWidth-gap*2)/3;
     var h=(wrap.clientHeight-gap*2)/3;

     var nest=document.createElement("div");

     nest.style.top=(row*(h+gap))+"px";
     nest.style.width=w+"px";
     nest.style.height=h+"px";

     inner.style.top="0";

     inner.style.height=wrap.clientHeight+"px";
     inner.style.transformOrigin="0 0";
     inner.style.transform="scale("+(w/wrap.clientWidth)+","+(h/wrap.clientHeight)+")";

 appendLevel(targetAncestorId,start,world);

 // Deepest visible rectangle relative to root.
 var rect={left:0,top:0,width:wrap.clientWidth,height:wrap.clientHeight};
 for(var i=start;i<lineage.length-1;i++){

function cameraBackTo(targetId,duration,done){

 var lineage=pathIds(fromId);
 var targetIndex=lineage.indexOf(targetId);
 var levels=Math.max(1,(lineage.length-1)-targetIndex);

 var sx=wrap.clientWidth/deepRect.width;
 var sy=wrap.clientHeight/deepRect.height;

 var deepCenterX=deepRect.left+deepRect.width/2;
 var deepCenterY=deepRect.top+deepRect.height/2;
 var viewCenterX=wrap.clientWidth/2;
 var viewCenterY=wrap.clientHeight/2;

 // Start with the deepest cell filling the viewport.
 function transformFor(scale,progress){
   var cx=deepCenterX+(viewCenterX-deepCenterX)*progress;
   var cy=deepCenterY+(viewCenterY-deepCenterY)*progress;
   var tx=viewCenterX-cx*scale;
   var ty=viewCenterY-cy*scale;
   return "translate("+tx+"px,"+ty+"px) scale("+scale+")";
 }

 var startScale=sx;
 var startTransform=transformFor(startScale,0);

 world.style.transformOrigin="0 0";
 world.style.transform=startTransform;
 world.style.opacity="1";

 var accelMs=560;
 var cruisePerExtraLevel=360;
 var totalMs=accelMs+Math.max(0,levels-1)*cruisePerExtraLevel;

 var live=document.getElementById("mandala");
 live.style.opacity="0";

 currentNode=targetId;
 renderMandala();
 var finalGrid=document.getElementById("mandala");
 finalGrid.style.opacity="0";

 var frames=[];
 var count=Math.max(6,levels*5);
 for(var i=0;i<=count;i++){
   var t=i/count;
   // Smoothly decelerating scale, while camera centre glides continuously.
   var eased=1-Math.pow(1-t,2.15);
   var scale=startScale+(1-startScale)*eased;
   frames.push({
     transform:transformFor(scale,eased),
     opacity:1-(0.86*eased),
     offset:t
   });
 }

 var worldAnim=world.animate(frames,{
   duration:totalMs,
   easing:"linear",
   fill:"forwards"
 });

 var fadeStart=Math.max(0,totalMs-210);
 setTimeout(function(){
   finalGrid.animate(
     [{opacity:0},{opacity:.35,offset:.35},{opacity:1}],
     {duration:210,easing:"ease-out",fill:"forwards"}
   );
   world.animate(
     [{opacity:.42},{opacity:.26,offset:.35},{opacity:0}],
     {duration:210,easing:"ease-out",fill:"forwards"}
   );
 },fadeStart);

 worldAnim.onfinish=function(){
   setTimeout(function(){
     world.remove();
     finalGrid.style.opacity="1";
     busy=false;
     if(done)done();
   },215);
 };
}

function savePaletteAsNew(){var ctx=paletteEditorContext,name=(currentNameInput().value||"").trim();if(!name){alert("名前を入力してください。");return}if(ctx.type==="accent"){var p={id:"c"+Date.now(),name:name,builtIn:false,c:Object.assign({},activePalette().c,{a1:editingPalette.c.a1,a2:editingPalette.c.a2,a3:editingPalette.c.a3})};state.customPalettes.push(p);state.activePaletteId=p.id}else{var b={id:"b"+Date.now(),name:name,c:{bg:editingPalette.c.bg,panel:editingPalette.c.panel,text:editingPalette.c.text,sub:editingPalette.c.sub,accentText:editingPalette.c.accentText,off:editingPalette.c.off,done:editingPalette.c.done}};state.customBases=state.customBases||[];state.customBases.push(b);state.backgroundMode="custom";state.activeBaseId=b.id;state.customBackground=Object.assign({},b.c)}applyPalette(activePalette());save();closePaletteEditor(ctx.type,true);openColorGroup=null;renderColorChoices()}
function overwriteCurrentPalette(){var ctx=paletteEditorContext,name=(currentNameInput().value||"").trim();if(!ctx||ctx.builtIn)return;if(!name){alert("名前を入力してください。");return}if(ctx.type==="accent"){var p=state.customPalettes.find(function(x){return x.id===ctx.item.id});if(!p)return;p.name=name;p.c.a1=editingPalette.c.a1;p.c.a2=editingPalette.c.a2;p.c.a3=editingPalette.c.a3;state.activePaletteId=p.id}else{var b=(state.customBases||[]).find(function(x){return x.id===ctx.item.id});if(!b)return;b.name=name;["bg","panel","text","sub","accentText","off","done"].forEach(function(k){b.c[k]=editingPalette.c[k]});state.backgroundMode="custom";state.activeBaseId=b.id;state.customBackground=Object.assign({},b.c)}applyPalette(activePalette());save();closePaletteEditor(ctx.type,true);openColorGroup=null;renderColorChoices()}
function deleteCurrentPalette(){var ctx=paletteEditorContext;if(!ctx||ctx.builtIn)return;if(!confirm("このパレットを削除しますか？"))return;if(ctx.type==="accent"){state.customPalettes=state.customPalettes.filter(function(x){return x.id!==ctx.item.id});if(state.activePaletteId===ctx.item.id)state.activePaletteId=builtins[0].id}else{state.customBases=(state.customBases||[]).filter(function(x){return x.id!==ctx.item.id});if(state.activeBaseId===ctx.item.id){state.backgroundMode="white";state.activeBaseId=null}}applyPalette(activePalette());save();closePaletteEditor(ctx.type,true);openColorGroup=null;renderColorChoices()}

var accentLabels={a1:"Accent 1",a2:"Accent 2",a3:"Accent 3"};
var baseLabels={bg:"Background",panel:"Panel / Cell",text:"Primary Text",sub:"Secondary Text",accentText:"Accent Text",off:"OFF",done:"Completed"};
var selectedColorKey="a1";
var colorMode="grid";
var spectrumHue=0;

function openLegacyPaletteEditor(p){
 // Compatibility shim retained for older calls; v4.7 uses openPaletteEditor(type,item,isNew).
 if(!p)return;
 openPaletteEditor("accent",p,false);
}

function luminanceText(hex){
 var h=hex.replace("#",""),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
 return (0.2126*r+0.7152*g+0.0722*b)>150?"#171717":"#F5F5F2";
}
function makeSwatch(k,label,container){
 var b=document.createElement("button");b.type="button";b.className="swatchBtn";b.dataset.colorKey=k;
 b.style.background=editingPalette.c[k];b.style.color=luminanceText(editingPalette.c[k]);
 b.innerHTML="<span class='swatchName'>"+label+"</span><span class='swatchHex'>"+editingPalette.c[k]+"</span>";
 b.onclick=function(){
   selectedColorKey=k;
   spectrumHue=hexToHsl(editingPalette.c[selectedColorKey])[0];
   highlightSelectedSwatches();
   renderColorWorkbench();
 };
 container.appendChild(b);
}
function highlightSelectedSwatches(){
 document.querySelectorAll(".swatchBtn").forEach(function(b){
   b.style.outline=b.dataset.colorKey===selectedColorKey?"2px solid var(--text)":"none";
   b.style.outlineOffset=b.dataset.colorKey===selectedColorKey?"2px":"0";
 });
}
function renderPaletteEditor(){
 var ctx=paletteEditorContext;if(!ctx)return;
 if(ctx.type==="accent"){
   var aPrev=document.getElementById("accentPreview");aPrev.innerHTML="";
   Object.keys(accentLabels).forEach(function(k){makeSwatch(k,accentLabels[k],aPrev)});
 }else{
   var bPrev=document.getElementById("basePreview");bPrev.innerHTML="";
   Object.keys(baseLabels).forEach(function(k){makeSwatch(k,baseLabels[k],bPrev)});
 }
 highlightSelectedSwatches();previewPalette();
}
function refreshSwatchesOnly(){
 document.querySelectorAll(".swatchBtn").forEach(function(b){
   var k=b.dataset.colorKey;
   if(!k)return;
   b.style.background=editingPalette.c[k];
   b.style.color=luminanceText(editingPalette.c[k]);
   var hex=b.querySelector(".swatchHex");if(hex)hex.textContent=editingPalette.c[k];
 });
}
function previewPalette(){
 Object.keys(editingPalette.c).forEach(function(k){document.documentElement.style.setProperty("--"+k,editingPalette.c[k])});
 refreshSwatchesOnly();
}
function hexToHsl(hex){
 var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 var max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,s=0,l=(max+min)/2;
 if(max!==min){var d=max-min;s=l>.5?d/(2-max-min):d/(max+min);if(max===r)h=(g-b)/d+(g<b?6:0);else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}
 return [h,s*100,l*100];
}
function hslToHex(h,s,l){
 h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;
 var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
 if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
 return "#"+[r,g,b].map(function(v){return Math.round((v+m)*255).toString(16).padStart(2,"0")}).join("").toUpperCase();
}
function setSelectedColor(v,rerenderWorkbench){
 editingPalette.c[selectedColorKey]=v.toUpperCase();
 previewPalette();
 if(rerenderWorkbench!==false&&paletteEditorContext)renderColorWorkbenchFor(paletteEditorContext.type);
}
function renderGridMode(){
 var box=document.getElementById("gridEditor");
 box.innerHTML="";
 box.className="colorModePanel";

 var matrix=document.createElement("div");
 matrix.className="colorGrid";
 box.appendChild(matrix);

 // Horizontal axis = lightness, vertical axis = hue.
 // First row is neutral grayscale; following rows move around the hue wheel.
 var lightness=[12,22,32,42,52,62,72,82,92];

 // Neutral row
 lightness.forEach(function(l){
   var c=hslToHex(0,0,l);
   var b=document.createElement("button");
   b.type="button";b.className="gridColor";b.style.background=c;
   b.setAttribute("aria-label","Gray "+l);
   b.onclick=function(){setSelectedColor(c)};
   matrix.appendChild(b);
 });

 // Hue rows
 var hues=[0,30,60,90,120,150,180,210,240,270,300,330];
 hues.forEach(function(h){
   lightness.forEach(function(l){
     // Saturation is kept moderately high so hue remains recognizable
     // while the horizontal lightness axis is visually clear.
     var c=hslToHex(h,78,l);
     var b=document.createElement("button");
     b.type="button";b.className="gridColor";b.style.background=c;
     b.setAttribute("aria-label","Hue "+h+" Lightness "+l);
     b.onclick=function(){setSelectedColor(c)};
     matrix.appendChild(b);
   });
 });
}
function renderSpectrumModeInto(box){
 var hsl=hexToHsl(editingPalette.c[selectedColorKey]);
 spectrumHue=isFinite(spectrumHue)?spectrumHue:hsl[0];
 box.innerHTML="<div class='spectrumPanel' id='spectrumPanel'><div class='spectrumWhite'></div><div class='spectrumBlack'></div><div class='spectrumCursor' id='spectrumCursor'></div></div><input class='hueStrip' id='hueStrip' type='range' min='0' max='360' value='"+Math.round(spectrumHue)+"'>";
 var panel=document.getElementById("spectrumPanel"),cursor=document.getElementById("spectrumCursor"),hue=document.getElementById("hueStrip");
 function setHueBackground(){panel.style.background="hsl("+spectrumHue+",100%,50%)"}
 function setCursorFromColor(){
   var c=hexToHsl(editingPalette.c[selectedColorKey]);
   var x=c[1]/100*panel.clientWidth;
   var y=(1-c[2]/100)*panel.clientHeight;
   cursor.style.left=Math.max(0,Math.min(panel.clientWidth,x))+"px";
   cursor.style.top=Math.max(0,Math.min(panel.clientHeight,y))+"px";
 }
 function pickAt(clientX,clientY){
   var r=panel.getBoundingClientRect();
   var x=Math.max(0,Math.min(r.width,clientX-r.left));
   var y=Math.max(0,Math.min(r.height,clientY-r.top));
   var s=x/r.width*100;
   // panel's black overlay makes vertical coordinate closer to lightness-like control
   var l=(1-y/r.height)*100;
   setSelectedColor(hslToHex(spectrumHue,s,l),false);
   cursor.style.left=x+"px";cursor.style.top=y+"px";
 }
 panel.addEventListener("pointerdown",function(e){panel.setPointerCapture(e.pointerId);pickAt(e.clientX,e.clientY)});
 panel.addEventListener("pointermove",function(e){if(e.buttons)pickAt(e.clientX,e.clientY)});
 hue.oninput=function(){spectrumHue=+this.value;setHueBackground();var c=hexToHsl(editingPalette.c[selectedColorKey]);setSelectedColor(hslToHex(spectrumHue,c[1],c[2]),false)};
 setHueBackground();setTimeout(setCursorFromColor,0);
}
function sliderHTML(label,id,min,max,val){
 return "<div class='sliderLine'><label>"+label+"</label><input class='colorRange' id='"+id+"' type='range' min='"+min+"' max='"+max+"' value='"+val+"'><output>"+Math.round(val)+"</output></div>";
}
function renderSlidersModeInto(box){
 var hsl=hexToHsl(editingPalette.c[selectedColorKey]);
 box.innerHTML=sliderHTML("H","slideH",0,360,hsl[0])+sliderHTML("S","slideS",0,100,hsl[1])+sliderHTML("L","slideL",0,100,hsl[2])+
 "<div class='hexReadout'><div class='chip' style='background:"+editingPalette.c[selectedColorKey]+"'></div><input class='hexInput' id='slideHex' value='"+editingPalette.c[selectedColorKey]+"'></div>";

 var h=document.getElementById("slideH"),s=document.getElementById("slideS"),l=document.getElementById("slideL");
 h.style.background="linear-gradient(to right,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000)";
 function refreshGradients(){
   var hv=+h.value,sv=+s.value,lv=+l.value;
   s.style.background="linear-gradient(to right,hsl("+hv+",0%,"+lv+"%),hsl("+hv+",100%,"+lv+"%))";
   l.style.background="linear-gradient(to right,#000,hsl("+hv+","+sv+"%,50%),#fff)";
 }
 refreshGradients();

 [h,s,l].forEach(function(el){
   el.oninput=function(){
     this.nextElementSibling.value=Math.round(this.value);
     refreshGradients();
     var v=hslToHex(+h.value,+s.value,+l.value);
     editingPalette.c[selectedColorKey]=v;
     previewPalette();
     document.getElementById("slideHex").value=v;
   };
 });

 document.getElementById("slideHex").onchange=function(){
   var v=this.value.trim();if(v.charAt(0)!=="#")v="#"+v;
   if(/^#[0-9A-Fa-f]{6}$/.test(v))setSelectedColor(v);
 };
}
function renderColorWorkbenchFor(type){
 var mode=type==="accent"?accentMode:baseMode;
 var sheet=document.getElementById(type==="accent"?"accentEditorSheet":"baseEditorSheet");
 var spec=document.getElementById(type==="accent"?"accentSpectrumEditor":"baseSpectrumEditor");
 var slid=document.getElementById(type==="accent"?"accentSlidersEditor":"baseSlidersEditor");
 sheet.querySelectorAll(".colorMode").forEach(function(b){b.classList.toggle("active",b.dataset.colorMode===mode)});
 spec.style.display=mode==="spectrum"?"block":"none";
 slid.style.display=mode==="sliders"?"block":"none";
 if(mode==="spectrum")renderSpectrumModeInto(spec);
 if(mode==="sliders")renderSlidersModeInto(slid);
}









document.getElementById("accentToggle").onclick=function(){openColorGroup=openColorGroup==="accent"?null:"accent";renderColorChoices()};
document.getElementById("baseToggle").onclick=function(){openColorGroup=openColorGroup==="base"?null:"base";renderColorChoices()};
document.getElementById("accentReset").onclick=resetSelectedColor;
document.getElementById("baseReset").onclick=resetSelectedColor;
document.querySelectorAll("#accentEditorSheet .colorMode").forEach(function(b){b.onclick=function(){accentMode=b.dataset.colorMode;renderColorWorkbenchFor("accent")}});
document.querySelectorAll("#baseEditorSheet .colorMode").forEach(function(b){b.onclick=function(){baseMode=b.dataset.colorMode;renderColorWorkbenchFor("base")}});

document.getElementById("baseEditorClose").onclick=function(){closePaletteEditor("base",false)};
document.getElementById("exportBtn").onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="3tasks-mndl-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)};
document.getElementById("importBtn").onclick=function(){document.getElementById("importFile").click()};
document.getElementById("importFile").onchange=function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.nodes||!x.today)throw new Error();state=x;state.customPalettes=state.customPalettes||[];state.customBases=state.customBases||[];currentNode="life";save();applyPalette(activePalette());renderAll();alert("復元しました")}catch(err){alert("読み込めないJSONです")}};r.readAsText(file)};

function renderAll(){renderToday();renderActions();renderMandala();renderColorChoices()}
load();
state.customPalettes=state.customPalettes||[];
if(state.activePaletteId==="signal")state.activePaletteId="field";
state.backgroundMode=state.backgroundMode||"white";
state.customBackground=state.customBackground||{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",off:"#D6D7D6",done:"#D0D1D0"};
if(typeof state.manualReselectUsed!=="boolean")state.manualReselectUsed=false;

// Preserve the existing v4.3 TODAY set on first migration.
// Automatic midnight reshuffle starts from the following Japan calendar day.
if(!state.todayDateKey)state.todayDateKey=japanDateKey(new Date());
shuffleTodayForNewDay(false);
applyPalette(activePalette());
renderAll();
renderBackgroundControls();
setPage(0,false);
save();
scheduleJapanMidnightShuffle();
})();
