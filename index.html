<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3TASKS MNDL Prototype vNext</title>
<style>
:root{--bg:#e9e9e9;--panel:#f3f3f3;--text:#171717;--sub:#737373;--a1:#c94a3f;--a2:#315a9f;--a3:#9a7226;--on:#f2f2ef}
*{box-sizing:border-box}html,body{margin:0;background:#d7d7d7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button,input{font:inherit}.phone{width:min(100vw,390px);height:min(100dvh,844px);min-height:650px;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.header{height:91px;padding:20px 16px 8px}.date{font-size:10px;letter-spacing:.09em;color:var(--sub)}h1{font-size:27px;margin:2px 0 0;letter-spacing:-.04em}
.viewport{position:absolute;top:91px;bottom:62px;left:0;right:0;overflow:hidden;touch-action:pan-y}.track{display:flex;width:400%;height:100%;transition:transform .25s}.page{width:25%;height:100%;flex:none;padding:0 16px;overflow-y:auto}
.cards{display:grid;gap:4px}.card{min-height:100px;border:0;border-radius:12px;padding:15px;color:var(--on);display:grid;grid-template-columns:42px 1fr 28px;align-items:center;text-align:left}.card:nth-child(1){background:var(--a1)}.card:nth-child(2){background:var(--a2)}.card:nth-child(3){background:var(--a3)}.num{font-size:27px;font-weight:760}.name{font-size:15px;font-weight:720}.path{font-size:10px;opacity:.72;margin-top:5px}.check{width:25px;height:25px;border:2px solid currentColor;border-radius:50%}
.crumb{font-size:11px;color:var(--sub);margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;aspect-ratio:1}.cell{border:0;border-radius:3px;background:var(--panel);color:var(--text);font-size:13px;font-weight:680;padding:5px}.center{color:var(--on);background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.actions{display:grid;gap:4px}.action{background:var(--panel);padding:12px 13px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.actionText{min-width:0}.actionTrail{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toggle{border:0;border-radius:999px;padding:7px 11px;color:var(--on);font-size:10px;font-weight:800;background:radial-gradient(circle at 5% 15%,var(--a1) 0 20%,transparent 54%),radial-gradient(circle at 95% 15%,var(--a2) 0 20%,transparent 54%),radial-gradient(circle at 50% 115%,var(--a3) 0 28%,transparent 62%),linear-gradient(135deg,var(--a1),var(--a2) 50%,var(--a3))}
.section{background:var(--panel);border-radius:11px;padding:13px;margin-bottom:8px}.section h2{font-size:11px;letter-spacing:.08em;margin:0 0 10px}.palette{border:0;background:transparent;width:100%;padding:9px 0;display:flex;align-items:center;justify-content:space-between;color:inherit;border-top:1px solid rgba(0,0,0,.08)}.palette:first-of-type{border-top:0}.dots{display:flex;gap:3px}.dots i{width:20px;height:20px;border-radius:5px;display:block}.badge{font-size:9px;color:var(--sub)}
.editor{display:none}.editor.show{display:block}.editrow{display:grid;grid-template-columns:1fr 42px 76px;align-items:center;gap:7px;padding:6px 0}.editrow label{font-size:11px}.editrow input[type=color]{width:42px;height:34px;border:0;padding:0;background:none}.editrow input[type=text]{width:76px;border:0;border-radius:7px;background:var(--bg);padding:7px;font-size:10px}
.previewStrip{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;height:42px;gap:2px;margin:8px 0}.previewStrip div{border-radius:5px}
.btns{display:flex;gap:6px;margin-top:9px}.btn{border:0;border-radius:8px;padding:9px 10px;background:#d8d8d8;color:#171717;font-size:11px;font-weight:700}.primary{background:#171717;color:white}.danger{color:#9c312d}
.footer{position:absolute;bottom:0;left:16px;right:16px;height:62px;border-top:1px solid rgba(0,0,0,.1);display:flex;justify-content:center;align-items:center;gap:22px;background:var(--bg)}.footer button{border:0;background:none;padding:10px 0;color:var(--sub);font-size:10px;font-weight:720}.footer button.active{color:var(--text)}.gear{font-size:18px}
</style>
</head>
<body>
<div class="phone" id="app">
 <header class="header"><div class="date">SAT 22 AUG</div><h1 id="title">TODAY</h1></header>
 <main class="viewport" id="viewport"><div class="track" id="track">
  <section class="page"><div class="cards"><button class="card"><span class="num">01</span><span><span class="name">20分自転車に乗る</span><span class="path">健康 / 運動</span></span><span class="check"></span></button><button class="card"><span class="num">02</span><span><span class="name">本を10ページ読む</span><span class="path">学び / 読書</span></span><span class="check"></span></button><button class="card"><span class="num">03</span><span><span class="name">スケッチを1つ描く</span><span class="path">創作 / 造形</span></span><span class="check"></span></button></div></section>
  <section class="page"><div class="crumb">人生 ← 健康 ← 運動</div><div class="grid"><button class="cell">健康</button><button class="cell">学び</button><button class="cell">創作</button><button class="cell">家族</button><button class="cell center">人生</button><button class="cell">仕事</button><button class="cell">遊び</button><button class="cell">お金</button><button class="cell">暮らし</button></div></section>
  <section class="page"><div class="actions" id="actions"></div></section>
  <section class="page">
   <div class="section"><h2>COLOR PALETTE</h2><div id="palettes"></div><button class="btn" id="newPalette" style="margin-top:8px">＋ NEW PALETTE</button></div>
   <div class="section editor" id="editor"><h2 id="editorTitle">EDIT PALETTE</h2><div class="previewStrip" id="strip"></div><div id="editRows"></div><div class="btns"><button class="btn primary" id="saveAs">新しいパレットとして保存</button><button class="btn" id="overwrite">上書き保存</button><button class="btn danger" id="deletePal">削除</button></div></div>
   <div class="section"><h2>DATA</h2><button class="btn">バックアップ</button> <button class="btn">復元</button></div>
  </section>
 </div></main>
 <nav class="footer"><button class="active" data-go="0">TODAY</button><button data-go="1">MANDALA</button><button data-go="2">ACTIONS</button><button data-go="3" aria-label="Settings"><span class="gear">⚙︎</span></button></nav>
</div>
<script>
(()=>{
const builtins=[
 {id:"bau",name:"BAU",builtIn:true,c:{bg:"#E9E9E9",panel:"#F3F3F3",text:"#171717",sub:"#737373",a1:"#C94A3F",a2:"#315A9F",a3:"#9A7226",on:"#F2F2EF"}},
 {id:"quiet",name:"QUIET",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#697D72",a2:"#667A8C",a3:"#927867",on:"#F4F4F1"}}
];
let custom=[];try{custom=JSON.parse(localStorage.getItem("mndl-custom-palettes")||"[]")}catch(e){custom=[]}let active=builtins[0],editing=null,page=0;function persistPalettes(){try{localStorage.setItem("mndl-custom-palettes",JSON.stringify(custom))}catch(e){}}
const labels={bg:"Background",panel:"Panel / Cell",text:"Primary Text",sub:"Secondary Text",a1:"Accent 1",a2:"Accent 2",a3:"Accent 3",on:"Accent Text"};
const root=document.documentElement, track=document.getElementById("track");
function apply(p){active=p;Object.entries(p.c).forEach(([k,v])=>root.style.setProperty("--"+k,v));renderPalettes()}
function dots(c){return `<span class="dots"><i style="background:${c.a1}"></i><i style="background:${c.a2}"></i><i style="background:${c.a3}"></i></span>`}
function renderPalettes(){const box=document.getElementById("palettes");box.innerHTML="";[...builtins,...custom].forEach(p=>{const b=document.createElement("button");b.className="palette";b.innerHTML=`<span><b>${p.name}</b> <span class="badge">${p.builtIn?"DEFAULT":"CUSTOM"}</span></span>${dots(p.c)}`;b.onclick=()=>{apply(p);openEditor(p)};box.appendChild(b)})}
function openEditor(p){editing={...p,c:{...p.c}};document.getElementById("editor").classList.add("show");document.getElementById("editorTitle").textContent="EDIT · "+p.name;renderEditor()}
function renderEditor(){const rows=document.getElementById("editRows");rows.innerHTML="";Object.entries(labels).forEach(([k,label])=>{const r=document.createElement("div");r.className="editrow";r.innerHTML=`<label>${label}</label><input type="color" value="${editing.c[k]}"><input type="text" value="${editing.c[k]}">`;const color=r.children[1],hex=r.children[2];color.oninput=()=>{editing.c[k]=color.value.toUpperCase();hex.value=editing.c[k];previewEdit()};hex.onchange=()=>{let v=hex.value.trim();if(!v.startsWith("#"))v="#"+v;if(/^#[0-9a-f]{6}$/i.test(v)){editing.c[k]=v.toUpperCase();color.value=v;previewEdit()}else hex.value=editing.c[k]};rows.appendChild(r)});document.getElementById("overwrite").style.display=editing.builtIn?"none":"block";document.getElementById("deletePal").style.display=editing.builtIn?"none":"block";previewEdit()}
function previewEdit(){Object.entries(editing.c).forEach(([k,v])=>root.style.setProperty("--"+k,v));const s=document.getElementById("strip");s.innerHTML=`<div style="background:${editing.c.bg}"></div><div style="background:${editing.c.a1}"></div><div style="background:${editing.c.a2}"></div><div style="background:${editing.c.a3}"></div>`}
document.getElementById("newPalette").onclick=()=>{editing={id:"c"+Date.now(),name:"MY PALETTE "+(custom.length+1),builtIn:false,c:{...active.c}};document.getElementById("editor").classList.add("show");document.getElementById("editorTitle").textContent="NEW PALETTE";renderEditor()};
document.getElementById("saveAs").onclick=()=>{const p={id:"c"+Date.now(),name:editing.builtIn?editing.name+" CUSTOM":editing.name+" COPY",builtIn:false,c:{...editing.c}};custom.push(p);persistPalettes();apply(p);openEditor(p)};
document.getElementById("overwrite").onclick=()=>{if(!editing||editing.builtIn)return;const i=custom.findIndex(x=>x.id===editing.id);if(i>=0){custom[i]={...editing,c:{...editing.c}};persistPalettes();apply(custom[i]);openEditor(custom[i])}};
document.getElementById("deletePal").onclick=()=>{if(!editing||editing.builtIn)return;custom=custom.filter(x=>x.id!==editing.id);persistPalettes();document.getElementById("editor").classList.remove("show");apply(builtins[0])};
const acts=[["20分自転車に乗る","人生 ← 健康 ← 運動"],["本を10ページ読む","人生 ← 学び ← 読書"],["スケッチを1つ描く","人生 ← 創作 ← 造形"],["23時までに寝る","人生 ← 健康 ← 睡眠"],["10分休む","人生 ← 健康 ← 休息"],["家計を確認する","人生 ← お金"]];document.getElementById("actions").innerHTML=acts.map(([x,p])=>`<div class="action"><div class="actionText"><div class="name">${x}</div><div class="actionTrail">${p}</div></div><button class="toggle">ON</button></div>`).join("");document.querySelectorAll(".toggle").forEach(b=>b.onclick=()=>{const on=b.textContent==="ON";b.textContent=on?"OFF":"ON";b.style.background=on?"#d3d3d3":"";b.style.color=on?"#555":""});
function go(i){page=Math.max(0,Math.min(3,i));track.style.transform=`translateX(-${page*25}%)`;document.getElementById("title").textContent=["TODAY","MANDALA","ACTIONS","SETTINGS"][page];document.querySelectorAll("[data-go]").forEach((b,j)=>b.classList.toggle("active",j===page))}
document.querySelectorAll("[data-go]").forEach((b,i)=>b.onclick=()=>go(i));let sx=0,sy=0;document.getElementById("viewport").onpointerdown=e=>{sx=e.clientX;sy=e.clientY};document.getElementById("viewport").onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)go(page+(dx<0?1:-1))};
renderPalettes();apply(active);go(0);
})();
</script>
</body></html>
