<!doctype html>
<html lang="ja">
<head>

<title>3TASKS MNDL Safari v2.4</title>
<style>
:root{
  --bg:#E7E8E8;--panel:#F4F4F3;--text:#202120;--sub:#747675;
  --a1:#A30084;--a2:#B69100;--a3:#00466D;--accentText:#F4F4F1;
  --off:#D6D7D6;--done:#D0D1D0;
  --safeTop:env(safe-area-inset-top,0px);--safeBottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
.app{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.header{position:absolute;top:var(--safeTop);left:0;right:0;height:104px;padding:18px;background:var(--bg);z-index:5}
.date{font-size:11px;letter-spacing:.13em;color:var(--sub)}
.title{margin-top:4px;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.045em}
.viewport{position:absolute;left:0;right:0;top:calc(var(--safeTop) + 104px);bottom:calc(var(--safeBottom) + 84px);overflow:hidden}
.track{width:400%;height:100%;display:flex;transform:translate3d(0,0,0);transition:transform .23s cubic-bezier(.2,.8,.2,1);will-change:transform}
.page{width:25%;flex:0 0 25%;height:100%;padding:0 18px;overflow:hidden;min-width:0}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
.footer{position:absolute;left:18px;right:18px;bottom:calc(var(--safeBottom) + 20px);height:64px;background:var(--bg);border-top:1px solid rgba(32,33,32,.12);display:flex;align-items:center;justify-content:center;gap:22px;z-index:6}
.footer button{border:0;background:none;padding:10px 0;min-height:44px;font-size:10px;font-weight:760;color:var(--sub)}
.footer button.active{color:var(--text)}.gear{font-size:20px}
.appmeta{position:absolute;left:18px;right:18px;bottom:var(--safeBottom);height:20px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:9px;letter-spacing:.08em;z-index:7}
.cards{display:grid;gap:4px}
.card{min-height:112px;border:0;border-radius:12px;padding:15px 14px 10px;display:grid;grid-template-columns:44px 1fr;grid-template-rows:1fr auto;gap:8px 9px;align-items:center;text-align:left;color:var(--accentText);position:relative}.cardMain{display:contents}.cardActions{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.24);padding-top:8px}.card.done .cardActions,.card.emptyCard .cardActions{border-top-color:rgba(32,33,32,.12)}.refresh{border:0;background:transparent;color:inherit;font-size:22px;line-height:1;padding:2px 5px}.doneBtn{border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:7px;padding:2px 4px;font-size:10px;font-weight:800;letter-spacing:.06em}.doneCircle{width:22px;height:22px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:12px}.card.emptyCard{background:var(--panel);color:var(--text)}.emptyCopy{font-size:14px;font-weight:650;line-height:1.35}.emptyCard .refresh{font-size:26px;color:var(--sub)}.refresh.used{opacity:.24;pointer-events:none}
.card.c1{background:var(--a1)}.card.c2{background:var(--a2)}.card.c3{background:var(--a3)}.card.done{background:var(--done);color:var(--text)}
.num{font-size:28px;font-weight:780}.taskName{font-size:16px;font-weight:730}.trail{font-size:10px;margin-top:5px;opacity:.76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:27px;height:27px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center}
.progress{height:4px;background:rgba(32,33,32,.12);border-radius:999px;margin-top:13px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--text)}.progressText{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--sub)}
.breadcrumb{min-height:28px;display:flex;gap:7px;align-items:center;overflow-x:auto;white-space:nowrap;margin-bottom:9px;font-size:11px;color:var(--sub)}
.breadcrumb button{border:0;background:none;padding:5px 0;color:inherit}
.mandalaWrap{position:relative;width:100%;aspect-ratio:1/1}
.mandala{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transition:transform .42s cubic-bezier(.18,.82,.2,1),opacity .22s ease}
.cell{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:3px;background:var(--panel);padding:7px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;transition:transform .18s ease,opacity .18s ease,color .42s linear}
.cell:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3));transition:opacity .42s linear}
.cell.center{color:var(--accentText)}.cell.center:before{opacity:1}.cell.holdIn,.cell.center.holdOut{transform:scale(.98)}
.cell.empty{font-size:22px;color:#A7A8A7;font-weight:400}.cell.empty:before{display:none}
.deep{position:absolute;right:5px;bottom:4px;opacity:.4}.hint{font-size:10px;color:var(--sub);margin-top:9px}
.ghost{position:absolute;z-index:20;border-radius:3px;background:var(--panel);display:grid;place-items:center;text-align:center;padding:7px;font-size:13px;font-weight:690;overflow:hidden;isolation:isolate;pointer-events:none;transition:left .42s cubic-bezier(.18,.82,.2,1),top .42s cubic-bezier(.18,.82,.2,1),width .42s cubic-bezier(.18,.82,.2,1),height .42s cubic-bezier(.18,.82,.2,1),opacity .16s ease}
.ghost.center:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.actions{display:grid;gap:4px}.action{background:var(--panel);border-radius:8px;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.actionCopy{min-width:0}.actionName{font-size:14px;font-weight:710}.actionTrail{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{border:0;border-radius:999px;min-width:48px;padding:8px 11px;font-size:10px;font-weight:800;color:var(--accentText);background:radial-gradient(circle at 5% 15%,var(--a1) 0 20%,transparent 54%),radial-gradient(circle at 95% 15%,var(--a2) 0 20%,transparent 54%),radial-gradient(circle at 50% 115%,var(--a3) 0 28%,transparent 62%),linear-gradient(135deg,var(--a1),var(--a2) 50%,var(--a3))}
.toggle.off{background:var(--off);color:#555}
.section{background:var(--panel);border-radius:12px;padding:13px;margin-bottom:8px}.section h2{margin:0 0 10px;font-size:11px;letter-spacing:.09em}
.paletteRow{width:100%;border:0;border-top:1px solid rgba(32,33,32,.09);background:none;min-height:53px;padding:9px 0;display:flex;align-items:center;justify-content:space-between;text-align:left}.paletteRow:first-of-type{border-top:0}.paletteName{font-size:13px;font-weight:720}.tag{font-size:9px;color:var(--sub);margin-left:6px}.dots{display:flex;gap:3px}.dots i{display:block;width:20px;height:20px;border-radius:5px}
.btn{border:0;border-radius:9px;padding:10px 12px;background:#D8D9D8;color:#202120;font-size:11px;font-weight:720;min-height:42px}.btn.primary{background:#171817;color:#fff}.btn.danger{color:#9B352F}.btn:disabled{opacity:.35}
.editor{display:none}.editor.show{display:block}.preview{height:52px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3px;margin:8px 0 10px}.preview div{border-radius:7px}.editRow{display:grid;grid-template-columns:1fr 44px 84px;gap:7px;align-items:center;padding:6px 0}.editRow label{font-size:11px}.editRow input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}.editRow input[type=text]{width:84px;border:0;border-radius:8px;background:var(--bg);padding:8px;font-size:11px}
.dataActions{display:flex;gap:6px;flex-wrap:wrap}.dataNote{font-size:10px;color:var(--sub);line-height:1.5;margin-top:8px}.fileInput{display:none}
.editSheet{position:absolute;left:18px;right:18px;bottom:calc(var(--safeBottom) + 104px);background:var(--panel);border-radius:14px;padding:14px;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.16);display:none}
.editSheet.show{display:block}.editTitle{font-size:14px;font-weight:760;margin-bottom:6px}.editTrail{font-size:10px;color:var(--sub);margin-bottom:10px}.editInput{width:100%;border:0;border-radius:9px;background:var(--bg);padding:11px;font-size:16px}.editActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.editBackdrop{position:absolute;inset:0;z-index:29;background:transparent;display:none}
.editBackdrop.show{display:block}
.editSheet{transition:opacity .14s ease,transform .14s ease}
.editSheet.hiddenBySwipe{opacity:0;transform:translateY(8px);pointer-events:none}
.moveSelect{width:100%;border:0;border-radius:9px;background:var(--bg);padding:11px;font-size:14px;margin-top:8px}
.movePanel{display:none;margin-top:10px}.movePanel.show{display:block}
.motionLayer{position:absolute;inset:0;pointer-events:none;z-index:19;overflow:visible}
.zoomClone{position:absolute;border-radius:3px;background:var(--panel);display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;padding:7px;overflow:hidden;isolation:isolate;transition:left .46s cubic-bezier(.18,.82,.2,1),top .46s cubic-bezier(.18,.82,.2,1),width .46s cubic-bezier(.18,.82,.2,1),height .46s cubic-bezier(.18,.82,.2,1),transform .46s cubic-bezier(.18,.82,.2,1),opacity .28s ease}
.zoomClone.centerLike{color:var(--accentText)}
.zoomClone.centerLike:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3))}
.parentIncoming{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;opacity:0;transform:scale(1.32);transition:transform .44s cubic-bezier(.18,.82,.2,1),opacity .18s ease}
.parentIncoming.show{opacity:1;transform:scale(1)}
.childOutgoing{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transition:transform .44s cubic-bezier(.18,.82,.2,1),opacity .18s ease}
.mandala.fadeInFinal{animation:fadeInFinal .20s ease both}
@keyframes fadeInFinal{from{opacity:0}to{opacity:1}}
.zoomClone.fadeOutFinal,.childOutgoing.fadeOutFinal,.parentIncoming.fadeOutFinal{opacity:0!important}


.paletteGroupTitle{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--sub);margin:3px 0 7px}
.swatchPreview{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.swatchPreview.basePreview{grid-template-columns:repeat(3,1fr)}
.swatchBtn{height:46px;border:0;border-radius:8px;position:relative;overflow:hidden;padding:0}
.swatchBtn span{position:absolute;left:6px;bottom:5px;font-size:8px;font-weight:750;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.swatchBtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.selectedColorEditor{margin-top:10px;padding-top:10px;border-top:1px solid rgba(32,33,32,.10)}.selectedColorLabel{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--sub);margin-bottom:7px}.selectedColorControls{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center}.selectedColorControls input[type=color]{width:54px;height:42px;border:0;background:none;padding:0}.selectedColorControls input[type=text]{border:0;border-radius:8px;background:var(--bg);padding:10px;font-size:12px;text-transform:uppercase}
.cameraOverlay{position:absolute;inset:0;z-index:23;pointer-events:none;overflow:hidden}
.cameraGrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;transform-origin:0 0;will-change:transform,opacity;transition:transform .72s cubic-bezier(.18,.78,.18,1),opacity .34s ease}
.cameraGrid .cell{pointer-events:none}

</style>
</head>
<body>
<div class="app">
<header class="header"><div class="date">SAT 22 AUG</div><div class="title" id="title">TODAY</div></header>
<div class="viewport" id="viewport"><div class="track" id="track">

<section class="page"><div class="scroll">
<div class="cards" id="cards"></div>
<div class="progress"><i id="bar"></i></div><div class="progressText"><span>今日の進捗</span><span id="count">0 / 3</span></div>
</div></section>

<section class="page"><div class="scroll">
<div class="breadcrumb" id="breadcrumb"></div>
<div class="mandalaWrap" id="mandalaWrap"><div class="mandala" id="mandala"></div><div class="motionLayer" id="motionLayer"></div><div class="cameraOverlay" id="cameraOverlay"></div></div>
<div class="hint">タップ：EDIT CELL ／ 長押し：9マス全体へ拡大して深掘り ／ 中央長押し：親セル位置へ縮小して戻る</div>
</div></section>

<section class="page"><div class="scroll"><div class="actions" id="actions"></div></div></section>

<section class="page"><div class="scroll">
<div class="section"><h2>COLOR PALETTE</h2><div id="paletteList"></div><button class="btn" id="newPalette">＋ NEW PALETTE</button></div>
<div class="section"><h2>BACKGROUND</h2>
<div class="dataActions">
<button class="btn" data-bgmode="white">WHITE</button>
<button class="btn" data-bgmode="black">BLACK</button>
<button class="btn" data-bgmode="custom" id="customBgBtn">CUSTOM</button>
</div>
<div id="customBgEditor" style="display:none;margin-top:10px"></div>
</div>
<div class="section editor" id="editor">
<h2 id="editorTitle">EDIT PALETTE</h2>
<div class="paletteGroupTitle">ACCENT COLORS</div>
<div class="swatchPreview" id="accentPreview"></div>
<div class="paletteGroupTitle" style="margin-top:14px">BASE COLORS</div>
<div class="swatchPreview basePreview" id="basePreview"></div>
<div class="selectedColorEditor" id="selectedColorEditor">
  <div class="selectedColorLabel" id="selectedColorLabel">Selected color</div>
  <div class="selectedColorControls">
    <input type="color" id="selectedColorPicker">
    <input type="text" id="selectedColorHex" maxlength="7">
  </div>
</div>
<div class="editActions">
  <button class="btn primary" id="saveAsPalette">新しいパレットとして保存</button>
  <button class="btn" id="overwritePalette">上書き保存</button>
  <button class="btn danger" id="deletePalette">削除</button>
</div>
</div>
</div>
<div class="section"><h2>DATA</h2><div class="dataActions"><button class="btn" id="exportBtn">JSONを書き出す</button><button class="btn" id="importBtn">JSONを読み込む</button><input class="fileInput" id="importFile" type="file" accept="application/json,.json"></div><div class="dataNote">Safari内へ自動保存し、JSONでもバックアップできます。</div></div>
</div></section>

</div></div>

<nav class="footer"><button class="active" data-page="0">TODAY</button><button data-page="1">MANDALA</button><button data-page="2">ACTIONS</button><button data-page="3"><span class="gear">⚙︎</span></button></nav>
<div class="appmeta">3TASKS MNDL · v2.4</div>

<div class="editBackdrop" id="editBackdrop"></div><div class="editSheet" id="editSheet">
  <div class="editTitle">EDIT CELL</div>
  <div class="editTrail" id="editTrail"></div>
  <input class="editInput" id="editInput" type="text" placeholder="項目名">
  <div class="editActions">
    <button class="btn primary" id="editSave">保存</button>
    <button class="btn" id="moveCell">移動</button>
    <button class="btn danger" id="deleteCell">削除</button>
    <button class="btn" id="editClose">閉じる</button>
  </div>
  <div class="movePanel" id="movePanel">
    <select class="moveSelect" id="moveSelect"></select>
    <div class="editActions">
      <button class="btn primary" id="moveApply">ここへ移動</button>
      <button class="btn" id="moveCancel">キャンセル</button>
    </div>
  </div>
</div>
</div>

<script>

(function(){
var STORAGE="mndl-v24";
var track=document.getElementById("track"),viewport=document.getElementById("viewport"),title=document.getElementById("title"),wrap=document.getElementById("mandalaWrap"),motionLayer=document.getElementById("motionLayer"),cameraOverlay=document.getElementById("cameraOverlay");
var page=0,gesture=null,currentNode="life",editingId=null,editingEmptySlot=null,editingPalette=null,busy=false,editVisiblePage=1;

var builtins=[
 {id:"field",name:"FIELD",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#A30084",a2:"#B69100",a3:"#00466D",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},
 {id:"form",name:"FORM",builtIn:true,c:{bg:"#E9E9E9",panel:"#F3F3F3",text:"#171717",sub:"#737373",a1:"#C94A3F",a2:"#315A9F",a3:"#9A7226",accentText:"#F2F2EF",off:"#D3D3D3",done:"#CFCFCF"}},
 {id:"mist",name:"MIST",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#94CDC2",a2:"#C9C3AE",a3:"#8F7C9A",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}},
 {id:"neon",name:"NEON",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#0001F1",a2:"#B2D000",a3:"#F5008B",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}}
];

var defaultNodes={
 life:{id:"life",name:"人生",parent:null,children:["health","learn","create","family","money","play"]},
 health:{id:"health",name:"健康",parent:"life",children:["sleep","food","exercise","rest"]},
 learn:{id:"learn",name:"学び",parent:"life",children:["reading"]},
 create:{id:"create",name:"創作",parent:"life",children:["sketch"]},
 family:{id:"family",name:"家族と過ごす",parent:"life",children:[]},
 money:{id:"money",name:"家計を確認する",parent:"life",children:[]},
 play:{id:"play",name:"新しいことを試す",parent:"life",children:[]},
 sleep:{id:"sleep",name:"睡眠",parent:"health",children:["bed"]},
 food:{id:"food",name:"食事を整える",parent:"health",children:[]},
 exercise:{id:"exercise",name:"運動",parent:"health",children:["bike","squat"]},
 rest:{id:"rest",name:"休息",parent:"health",children:["break10"]},
 reading:{id:"reading",name:"読書",parent:"learn",children:["book10"]},
 sketch:{id:"sketch",name:"造形",parent:"create",children:["sketch1"]},
 bed:{id:"bed",name:"23時までに寝る",parent:"sleep",children:[]},
 bike:{id:"bike",name:"20分自転車に乗る",parent:"exercise",children:[]},
 squat:{id:"squat",name:"スクワット10回",parent:"exercise",children:[]},
 break10:{id:"break10",name:"10分休む",parent:"rest",children:[]},
 book10:{id:"book10",name:"本を10ページ読む",parent:"reading",children:[]},
 sketch1:{id:"sketch1",name:"スケッチを1つ描く",parent:"sketch",children:[]}
};

var state={nodes:JSON.parse(JSON.stringify(defaultNodes)),enabled:{},today:[{id:"bike",tone:1,done:false},{id:"book10",tone:2,done:false},{id:"sketch1",tone:3,done:false}],customPalettes:[],activePaletteId:"field",backgroundMode:"white",customBackground:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",off:"#D6D7D6",done:"#D0D1D0"},manualReselectUsed:false};

function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(STORAGE)||"null");if(s&&s.nodes)state=Object.assign(state,s)}catch(e){}}
function node(id){return state.nodes[id]}
function pathIds(id){var a=[],n=node(id);while(n){a.unshift(n.id);n=n.parent?node(n.parent):null}return a}
function trail(id){return pathIds(id).slice(0,-1).map(function(x){return node(x).name}).join(" ← ")}
function leaves(){return Object.keys(state.nodes).map(function(k){return state.nodes[k]}).filter(function(n){return n.id!=="life"&&n.children.length===0})}

function hideEditForSwipe(){
 var sheet=document.getElementById("editSheet");
 if(sheet.classList.contains("show"))sheet.classList.add("hiddenBySwipe");
}
function restoreEditIfMandala(){
 var sheet=document.getElementById("editSheet");
 if(page===1 && sheet.classList.contains("show"))sheet.classList.remove("hiddenBySwipe");
}
function setPage(n,animate){
 page=Math.max(0,Math.min(3,n));
 track.style.transition=animate===false?"none":"transform .23s cubic-bezier(.2,.8,.2,1)";
 track.style.transform="translate3d(-"+(page*25)+"%,0,0)";
 title.textContent=["TODAY","MANDALA","ACTIONS","SETTINGS"][page];
 var bs=document.querySelectorAll("[data-page]");for(var i=0;i<bs.length;i++)bs[i].classList.toggle("active",i===page);
 if(page===1)restoreEditIfMandala();
}
var nav=document.querySelectorAll("[data-page]");for(var i=0;i<nav.length;i++){(function(idx){nav[idx].onclick=function(){if(idx!==1)hideEditForSwipe();setPage(idx,true)}})(i)}

viewport.addEventListener("touchstart",function(e){
 if(e.touches.length!==1||e.target.closest("input,select,.editor"))return;
 var t=e.touches[0];gesture={x:t.clientX,y:t.clientY,dx:0,dy:0,axis:"",start:page};track.style.transition="none";
},{passive:true});
viewport.addEventListener("touchmove",function(e){

function syncSelectedColorEditor(){
 var label=accentLabels[selectedColorKey]||baseLabels[selectedColorKey]||selectedColorKey;
 document.getElementById("selectedColorLabel").textContent=label;
 document.getElementById("selectedColorPicker").value=editingPalette.c[selectedColorKey];
 document.getElementById("selectedColorHex").value=editingPalette.c[selectedColorKey];
}
function renderPaletteEditor(){
 var aPrev=document.getElementById("accentPreview"),bPrev=document.getElementById("basePreview");
 aPrev.innerHTML="";bPrev.innerHTML="";
 Object.keys(accentLabels).forEach(function(k){makeSwatch(k,accentLabels[k],aPrev)});
 Object.keys(baseLabels).forEach(function(k){makeSwatch(k,baseLabels[k],bPrev)});
 document.getElementById("overwritePalette").style.display=editingPalette.builtIn?"none":"inline-block";
 document.getElementById("deletePalette").style.display=editingPalette.builtIn?"none":"inline-block";
 syncSelectedColorEditor();highlightSelectedSwatches();previewPalette();
}
function previewPalette(){
 Object.keys(editingPalette.c).forEach(function(k){document.documentElement.style.setProperty("--"+k,editingPalette.c[k])});
}
document.getElementById("selectedColorPicker").oninput=function(){
 editingPalette.c[selectedColorKey]=this.value.toUpperCase();
 renderPaletteEditor();
};
document.getElementById("selectedColorHex").onchange=function(){
 var v=this.value.trim();if(v.charAt(0)!=="#")v="#"+v;
 if(/^#[0-9A-Fa-f]{6}$/.test(v)){editingPalette.c[selectedColorKey]=v.toUpperCase();renderPaletteEditor()}
 else this.value=editingPalette.c[selectedColorKey];
};
document.getElementById("newPalette").onclick=function(){
 var p=activePalette(),c=Object.assign({},p.c),bg=backgroundValues();Object.keys(bg).forEach(function(k){c[k]=bg[k]});
 editingPalette={id:"c"+Date.now(),name:"MY PALETTE "+(state.customPalettes.length+1),builtIn:false,c:c};
 document.getElementById("editor").classList.add("show");document.getElementById("editorTitle").textContent="NEW PALETTE";renderPaletteEditor();
};
document.getElementById("saveAsPalette").onclick=function(){
 var p={id:"c"+Date.now(),name:editingPalette.builtIn?editingPalette.name+" CUSTOM":editingPalette.name+" COPY",builtIn:false,c:Object.assign({},editingPalette.c)};
 state.customPalettes.push(p);
 state.customBackground={bg:editingPalette.c.bg,panel:editingPalette.c.panel,text:editingPalette.c.text,sub:editingPalette.c.sub,off:editingPalette.c.off,done:editingPalette.c.done};
 state.backgroundMode="custom";
 applyPalette(p);save();renderPaletteList();renderBackgroundControls();openPaletteEditor(p);
};
document.getElementById("overwritePalette").onclick=function(){
 if(!editingPalette||editingPalette.builtIn)return;
 var i=state.customPalettes.findIndex(function(x){return x.id===editingPalette.id});
 if(i>=0){
   state.customPalettes[i]={id:editingPalette.id,name:editingPalette.name,builtIn:false,c:Object.assign({},editingPalette.c)};
   if(state.backgroundMode==="custom")state.customBackground={bg:editingPalette.c.bg,panel:editingPalette.c.panel,text:editingPalette.c.text,sub:editingPalette.c.sub,off:editingPalette.c.off,done:editingPalette.c.done};
   applyPalette(state.customPalettes[i]);save();renderPaletteList();renderBackgroundControls();
 }
};
document.getElementById("deletePalette").onclick=function(){if(!editingPalette||editingPalette.builtIn)return;state.customPalettes=state.customPalettes.filter(function(x){return x.id!==editingPalette.id});document.getElementById("editor").classList.remove("show");applyPalette(builtins[0]);save();renderPaletteList()};

document.getElementById("exportBtn").onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="3tasks-mndl-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)};
document.getElementById("importBtn").onclick=function(){document.getElementById("importFile").click()};
document.getElementById("importFile").onchange=function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.nodes||!x.today)throw new Error();state=x;state.customPalettes=state.customPalettes||[];currentNode="life";save();applyPalette(activePalette());renderAll();alert("復元しました")}catch(err){alert("読み込めないJSONです")}};r.readAsText(file)};

function renderAll(){renderToday();renderActions();renderMandala();renderPaletteList()}
load();
state.customPalettes=state.customPalettes||[];
if(state.activePaletteId==="signal")state.activePaletteId="field";
state.backgroundMode=state.backgroundMode||"white";
state.customBackground=state.customBackground||{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",off:"#D6D7D6",done:"#D0D1D0"};
if(typeof state.manualReselectUsed!=="boolean")state.manualReselectUsed=false;
applyPalette(activePalette());renderAll();renderBackgroundControls();setPage(0,false);
})();

</script>
</body>
