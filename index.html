<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E7E8E8">
<title>3TASKS MNDL Safari v1.1</title>
<style>
:root{--bg:#E7E8E8;--panel:#F4F4F3;--text:#202120;--sub:#747675;--a1:#A30084;--a2:#B69100;--a3:#00466D;--accentText:#F4F4F1;--off:#D6D7D6;--done:#D0D1D0;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{color:inherit}
.app{position:absolute;inset:0;background:var(--bg);overflow:hidden;padding-top:var(--safe-top)}
.header{position:absolute;left:0;right:0;top:var(--safe-top);height:104px;padding:18px 18px 10px;background:var(--bg);z-index:5}
.date{font-size:11px;letter-spacing:.13em;color:var(--sub)}.title{margin-top:3px;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.045em}
.viewport{position:absolute;left:0;right:0;top:calc(var(--safe-top) + 104px);bottom:calc(var(--safe-bottom) + 64px);overflow:hidden;touch-action:pan-y}
.track{width:400%;height:100%;display:flex;transform:translate3d(0,0,0);transition:transform .23s cubic-bezier(.2,.8,.2,1);will-change:transform}
.page{width:25%;height:100%;flex:0 0 25%;min-width:0;overflow:hidden;padding:0 18px}.page-scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
.footer{position:absolute;left:18px;right:18px;bottom:var(--safe-bottom);height:64px;display:flex;align-items:center;justify-content:center;gap:22px;background:var(--bg);border-top:1px solid rgba(32,33,32,.12);z-index:6}
.footer button{border:0;background:transparent;padding:10px 0 8px;min-height:44px;font-size:10px;font-weight:760;color:var(--sub)}.footer button.active{color:var(--text)}.gear{font-size:20px}
.cards{display:grid;gap:4px}.card{border:0;border-radius:12px;min-height:102px;padding:15px 14px;display:grid;grid-template-columns:44px 1fr 30px;gap:9px;align-items:center;text-align:left;color:var(--accentText);touch-action:pan-y}
.card.c1{background:var(--a1)}.card.c2{background:var(--a2)}.card.c3{background:var(--a3)}.card.done{background:var(--done);color:var(--text)}
.num{font-size:28px;font-weight:780}.task-name{font-size:16px;font-weight:730}.trail{font-size:10px;margin-top:5px;opacity:.76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:27px;height:27px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center}
.progress-line{height:4px;border-radius:999px;background:rgba(32,33,32,.12);margin-top:13px;overflow:hidden}.progress-line i{display:block;height:100%;width:0;background:var(--text)}.progress-label{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--sub)}
.breadcrumb{min-height:28px;display:flex;align-items:center;gap:7px;overflow-x:auto;white-space:nowrap;margin-bottom:9px;font-size:11px;color:var(--sub)}.breadcrumb button{border:0;background:transparent;padding:5px 0;color:inherit}
.mandala{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;aspect-ratio:1/1}.cell{position:relative;overflow:hidden;isolation:isolate;border:0;border-radius:3px;background:var(--panel);color:var(--text);padding:7px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:690;touch-action:pan-y;transition:transform .15s ease,color .38s linear}
.cell:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 18% 18%,var(--a1),transparent 56%),radial-gradient(circle at 84% 22%,var(--a2),transparent 58%),radial-gradient(circle at 52% 88%,var(--a3),transparent 60%),linear-gradient(145deg,var(--a1),var(--a2) 52%,var(--a3));transition:opacity .42s linear}
.cell.center{color:var(--accentText)}.cell.center:before,.cell.hold-in:before{opacity:1}.cell.hold-in{color:var(--accentText);transform:scale(.975)}.cell.center.hold-out:before{opacity:0}.cell.center.hold-out{color:var(--text);transform:scale(.975)}.cell.empty{color:#A7A8A7;font-size:22px}.cell.empty:before{display:none}.deep{position:absolute;right:5px;bottom:4px;opacity:.4}.hint{font-size:10px;color:var(--sub);margin-top:9px}
.actions{display:grid;gap:4px}.action{background:var(--panel);border-radius:8px;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.action-copy{min-width:0}.action-name{font-size:14px;font-weight:710}.action-trail{font-size:10px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{border:0;border-radius:999px;min-width:48px;padding:8px 11px;font-size:10px;font-weight:800;color:var(--accentText);background:radial-gradient(circle at 5% 15%,var(--a1) 0 20%,transparent 54%),radial-gradient(circle at 95% 15%,var(--a2) 0 20%,transparent 54%),radial-gradient(circle at 50% 115%,var(--a3) 0 28%,transparent 62%),linear-gradient(135deg,var(--a1),var(--a2) 50%,var(--a3))}.toggle.off{background:var(--off);color:#555}
.section{background:var(--panel);border-radius:12px;padding:13px;margin-bottom:8px}.section h2{margin:0 0 10px;font-size:11px;letter-spacing:.09em}.palette-row{width:100%;border:0;border-top:1px solid rgba(32,33,32,.09);background:transparent;min-height:53px;padding:9px 0;display:flex;align-items:center;justify-content:space-between;text-align:left}.palette-row:first-of-type{border-top:0}.palette-name{font-size:13px;font-weight:720}.palette-tag{font-size:9px;color:var(--sub);margin-left:6px}.dots{display:flex;gap:3px}.dots i{display:block;width:20px;height:20px;border-radius:5px}
.btn{border:0;border-radius:9px;padding:10px 12px;background:#D8D9D8;color:#202120;font-size:11px;font-weight:720;min-height:42px}.btn.primary{background:#171817;color:#fff}.btn.danger{color:#9B352F}.editor{display:none}.editor.show{display:block}.palette-preview{height:52px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3px;margin:8px 0 10px}.palette-preview div{border-radius:7px}.edit-row{display:grid;grid-template-columns:1fr 44px 84px;gap:7px;align-items:center;padding:6px 0}.edit-row label{font-size:11px}.edit-row input[type=color]{width:44px;height:36px;border:0;background:transparent;padding:0}.edit-row input[type=text]{width:84px;border:0;border-radius:8px;background:var(--bg);color:var(--text);padding:8px;font-size:11px}.editor-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sheet{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 74px);background:var(--panel);border-radius:14px;padding:14px;z-index:20;box-shadow:0 16px 36px rgba(0,0,0,.16);display:none}.sheet.show{display:block}.sheet-title{font-size:14px;font-weight:760;margin-bottom:8px}.sheet-copy{font-size:11px;color:var(--sub);margin-bottom:10px}.sheet-actions{display:flex;gap:6px}
@media(max-width:350px){.header,.page{padding-left:14px;padding-right:14px}.footer{left:14px;right:14px;gap:16px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="date">SAT 22 AUG</div><div class="title" id="screenTitle">TODAY</div></header>
<div class="viewport" id="viewport"><div class="track" id="track">
<section class="page"><div class="page-scroll"><div class="cards" id="todayCards"></div><div class="progress-line"><i id="progressBar"></i></div><div class="progress-label"><span>今日の進捗</span><span id="progressText">0 / 3</span></div></div></section>
<section class="page"><div class="page-scroll"><div class="breadcrumb" id="breadcrumb"></div><div class="mandala" id="mandala"></div><div class="hint">タップ：編集 ／ 長押し：深掘り ／ 中央長押し：色が抜けて戻る</div></div></section>
<section class="page"><div class="page-scroll"><div class="actions" id="actions"></div></div></section>
<section class="page"><div class="page-scroll">
<div class="section"><h2>COLOR PALETTE</h2><div id="paletteList"></div><button type="button" class="btn" id="newPalette">＋ NEW PALETTE</button></div>
<div class="section editor" id="paletteEditor"><h2 id="editorTitle">EDIT PALETTE</h2><div class="palette-preview" id="palettePreview"></div><div id="editRows"></div><div class="editor-actions"><button type="button" class="btn primary" id="saveAs">新しいパレットとして保存</button><button type="button" class="btn" id="overwrite">上書き保存</button><button type="button" class="btn danger" id="deletePalette">削除</button></div></div>
<div class="section"><h2>DATA</h2><div style="font-size:10px;color:var(--sub)">ブラウザ内へ自動保存。JSONバックアップは次版で実装。</div></div>
</div></section>
</div></div>
<nav class="footer"><button type="button" class="active" data-page="0">TODAY</button><button type="button" data-page="1">MANDALA</button><button type="button" data-page="2">ACTIONS</button><button type="button" data-page="3"><span class="gear">⚙︎</span></button></nav>
<div class="sheet" id="editSheet"><div class="sheet-title">セルを編集</div><div class="sheet-copy" id="sheetTrail"></div><input id="nodeName" type="text" style="width:100%;border:0;border-radius:9px;background:var(--bg);padding:11px;font-size:16px"><div class="sheet-actions" style="margin-top:10px"><button type="button" class="btn primary" id="saveNode">保存</button><button type="button" class="btn" id="closeSheet">閉じる</button></div></div>
</div>
<script>
(function(){
const DEFAULT={id:"main-default",name:"MAIN",builtIn:true,c:{bg:"#E7E8E8",panel:"#F4F4F3",text:"#202120",sub:"#747675",a1:"#A30084",a2:"#B69100",a3:"#00466D",accentText:"#F4F4F1",off:"#D6D7D6",done:"#D0D1D0"}};
const BAU={id:"bau-default",name:"BAU",builtIn:true,c:{bg:"#E9E9E9",panel:"#F3F3F3",text:"#171717",sub:"#737373",a1:"#C94A3F",a2:"#315A9F",a3:"#9A7226",accentText:"#F2F2EF",off:"#D3D3D3",done:"#CFCFCF"}};
const builtins=[DEFAULT,BAU];
const initialNodes={life:{id:"life",name:"人生",parent:null,children:["health","learn","create","family","money","play"]},health:{id:"health",name:"健康",parent:"life",children:["sleep","food","exercise","rest"]},learn:{id:"learn",name:"学び",parent:"life",children:["reading"]},create:{id:"create",name:"創作",parent:"life",children:["sketch"]},family:{id:"family",name:"家族と過ごす",parent:"life",children:[]},money:{id:"money",name:"家計を確認する",parent:"life",children:[]},play:{id:"play",name:"新しいことを試す",parent:"life",children:[]},sleep:{id:"sleep",name:"睡眠",parent:"health",children:["bed"]},food:{id:"food",name:"食事を整える",parent:"health",children:[]},exercise:{id:"exercise",name:"運動",parent:"health",children:["bike","squat"]},rest:{id:"rest",name:"休息",parent:"health",children:["break10"]},reading:{id:"reading",name:"読書",parent:"learn",children:["book10"]},sketch:{id:"sketch",name:"造形",parent:"create",children:["sketch1"]},bed:{id:"bed",name:"23時までに寝る",parent:"sleep",children:[]},bike:{id:"bike",name:"20分自転車に乗る",parent:"exercise",children:[]},squat:{id:"squat",name:"スクワット10回",parent:"exercise",children:[]},break10:{id:"break10",name:"10分休む",parent:"rest",children:[]},book10:{id:"book10",name:"本を10ページ読む",parent:"reading",children:[]},sketch1:{id:"sketch1",name:"スケッチを1つ描く",parent:"sketch",children:[]}};
let state={page:0,current:"life",nodes:JSON.parse(JSON.stringify(initialNodes)),enabled:{},today:[{id:"bike",tone:1,done:false},{id:"book10",tone:2,done:false},{id:"sketch1",tone:3,done:false}],customPalettes:[],activePaletteId:"main-default"};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),root=document.documentElement,track=$("#track"),viewport=$("#viewport");let editingPalette=null,editingNodeId=null,gesture=null,longTriggered=false;
function load(){try{const x=JSON.parse(localStorage.getItem("mndlSafariV1_1")||"null");if(x&&x.nodes)state={...state,...x}}catch(e){}}
function save(){try{localStorage.setItem("mndlSafariV1_1",JSON.stringify(state))}catch(e){}}
function palettes(){return builtins.concat(state.customPalettes||[])}function activePalette(){return palettes().find(p=>p.id===state.activePaletteId)||DEFAULT}
function applyPalette(p){state.activePaletteId=p.id;Object.entries(p.c).forEach(([k,v])=>root.style.setProperty("--"+k,v));document.querySelector('meta[name="theme-color"]').setAttribute("content",p.c.bg);save();renderPaletteList()}
function node(id){return state.nodes[id]}function pathIds(id){const a=[];let n=node(id);while(n){a.unshift(n.id);n=n.parent?node(n.parent):null}return a}
function trail(id){return pathIds(id).slice(0,-1).map(x=>node(x).name).join(" ← ")}function leaves(){return Object.values(state.nodes).filter(n=>n.id!=="life"&&!n.children.length)}
function setPage(i,anim=true){state.page=Math.max(0,Math.min(3,i));track.style.transition=anim?"transform .23s cubic-bezier(.2,.8,.2,1)":"none";track.style.transform=`translate3d(-${state.page*25}%,0,0)`;$("#screenTitle").textContent=["TODAY","MANDALA","ACTIONS","SETTINGS"][state.page];$$("[data-page]").forEach((b,j)=>b.classList.toggle("active",j===state.page));save()}
function renderToday(){const box=$("#todayCards");box.innerHTML="";state.today.forEach((t,i)=>{const n=node(t.id),b=document.createElement("button");b.type="button";b.className=`card c${t.tone}${t.done?" done":""}`;b.innerHTML=`<div class="num">0${i+1}</div><div><div class="task-name">${n.name}</div><div class="trail">${trail(t.id)}</div></div><div class="check">${t.done?"✓":""}</div>`;b.addEventListener("click",()=>{if(longTriggered)return;t.done=!t.done;renderToday();save()});box.appendChild(b)});const c=state.today.filter(x=>x.done).length;$("#progressText").textContent=`${c} / 3`;$("#progressBar").style.width=(c/3*100)+"%"}
function renderBreadcrumb(){const box=$("#breadcrumb");box.innerHTML="";const ids=pathIds(state.current);ids.forEach((id,i)=>{const b=document.createElement("button");b.type="button";b.textContent=node(id).name;b.onclick=()=>{state.current=id;renderMandala();save()};box.appendChild(b);if(i<ids.length-1){const s=document.createElement("span");s.textContent="←";box.appendChild(s)}})}
function bindLong(el,id,center){let timer,sx=0,sy=0,moved=false;function start(e){const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;moved=false;longTriggered=false;el.classList.add(center?"hold-out":"hold-in");timer=setTimeout(()=>{if(moved)return;longTriggered=true;if(center){const pId=node(state.current).parent;if(pId)state.current=pId}else state.current=id;renderMandala();save();setTimeout(()=>longTriggered=false,100)},430)}function move(e){const p=e.touches?e.touches[0]:e;if(Math.hypot(p.clientX-sx,p.clientY-sy)>12){moved=true;clearTimeout(timer);el.classList.remove("hold-in","hold-out")}}function end(){clearTimeout(timer);if(!longTriggered)el.classList.remove("hold-in","hold-out")}el.addEventListener("touchstart",start,{passive:true});el.addEventListener("touchmove",move,{passive:true});el.addEventListener("touchend",end,{passive:true});}
function openEditor(id){editingNodeId=id;$("#nodeName").value=node(id).name;$("#sheetTrail").textContent=pathIds(id).map(x=>node(x).name).join(" ← ");$("#editSheet").classList.add("show")}
function renderMandala(){
  renderBreadcrumb();
  const box=$("#mandala");
  box.innerHTML="";
  const cur=node(state.current);
  const slots=[0,1,2,3,"c",4,5,6,7];
  slots.forEach(s=>{
    const b=document.createElement("button");
    b.type="button";
    if(s==="c"){
      b.className="cell center";
      b.textContent=cur.name;
      bindLong(b,cur.id,true);
      b.onclick=()=>{if(!longTriggered)openEditor(cur.id)};
    }else{
      const id=cur.children[s];
      if(id){
        const ch=node(id);
        b.className="cell";
        b.innerHTML=`<span>${ch.name}</span>${ch.children.length?'<span class="deep">›</span>':""}`;
        bindLong(b,id,false);
        b.onclick=()=>{if(!longTriggered)openEditor(id)};
      }else{
        b.className="cell empty";
        b.textContent="＋";
        b.onclick=()=>{
          const name=prompt("新しい項目名");
          if(!name||!name.trim()||cur.children.length>=8)return;
          const id="n"+Date.now();
          state.nodes[id]={id,name:name.trim(),parent:cur.id,children:[]};
          cur.children.push(id);
          renderMandala();
          renderActions();
          save();
        };
      }
    }
    box.appendChild(b);
  });
}
function renderActions(){const box=$("#actions");box.innerHTML="";leaves().forEach(n=>{const d=document.createElement("div");d.className="action";const on=state.enabled[n.id]!==false;d.innerHTML=`<div class="action-copy"><div class="action-name">${n.name}</div><div class="action-trail">${trail(n.id)}</div></div><button type="button" class="toggle ${on?"":"off"}">${on?"ON":"OFF"}</button>`;d.querySelector(".toggle").onclick=()=>{state.enabled[n.id]=!(state.enabled[n.id]!==false);renderActions();save()};box.appendChild(d)})}
const labels={bg:"Background",panel:"Panel / Cell",text:"Primary Text",sub:"Secondary Text",a1:"Accent 1",a2:"Accent 2",a3:"Accent 3",accentText:"Accent Text",off:"OFF",done:"Completed"};
function dots(p){return `<span class="dots"><i style="background:${p.c.a1}"></i><i style="background:${p.c.a2}"></i><i style="background:${p.c.a3}"></i></span>`}
function renderPaletteList(){const box=$("#paletteList");box.innerHTML="";palettes().forEach(p=>{const b=document.createElement("button");b.type="button";b.className="palette-row";b.innerHTML=`<span><span class="palette-name">${p.name}</span><span class="palette-tag">${p.builtIn?"DEFAULT":"CUSTOM"}</span></span>${dots(p)}`;b.onclick=()=>{applyPalette(p);editingPalette={...p,c:{...p.c}};$("#paletteEditor").classList.add("show");$("#editorTitle").textContent="EDIT · "+p.name;renderPaletteEditor()};box.appendChild(b)})}
function renderPaletteEditor(){const rows=$("#editRows");rows.innerHTML="";Object.entries(labels).forEach(([k,label])=>{const r=document.createElement("div");r.className="edit-row";r.innerHTML=`<label>${label}</label><input type="color" value="${editingPalette.c[k]}"><input type="text" value="${editingPalette.c[k]}">`;const c=r.children[1],h=r.children[2];c.oninput=()=>{editingPalette.c[k]=c.value.toUpperCase();h.value=editingPalette.c[k];previewEdit()};h.onchange=()=>{let v=h.value.trim();if(!v.startsWith("#"))v="#"+v;if(/^#[0-9A-Fa-f]{6}$/.test(v)){editingPalette.c[k]=v.toUpperCase();c.value=v;previewEdit()}else h.value=editingPalette.c[k]};rows.appendChild(r)});$("#overwrite").style.display=editingPalette.builtIn?"none":"inline-block";$("#deletePalette").style.display=editingPalette.builtIn?"none":"inline-block";previewEdit()}
function previewEdit(){Object.entries(editingPalette.c).forEach(([k,v])=>root.style.setProperty("--"+k,v));$("#palettePreview").innerHTML=`<div style="background:${editingPalette.c.bg}"></div><div style="background:${editingPalette.c.a1}"></div><div style="background:${editingPalette.c.a2}"></div><div style="background:${editingPalette.c.a3}"></div>`}
$("#newPalette").onclick=()=>{const base=activePalette();editingPalette={id:"c"+Date.now(),name:"MY PALETTE "+(state.customPalettes.length+1),builtIn:false,c:{...base.c}};$("#paletteEditor").classList.add("show");$("#editorTitle").textContent="NEW PALETTE";renderPaletteEditor()}
$("#saveAs").onclick=()=>{const p={id:"c"+Date.now(),name:editingPalette.builtIn?editingPalette.name+" CUSTOM":editingPalette.name+" COPY",builtIn:false,c:{...editingPalette.c}};state.customPalettes.push(p);applyPalette(p);editingPalette={...p,c:{...p.c}};renderPaletteEditor();save()}
$("#overwrite").onclick=()=>{if(!editingPalette||editingPalette.builtIn)return;const i=state.customPalettes.findIndex(x=>x.id===editingPalette.id);if(i>=0){state.customPalettes[i]={...editingPalette,c:{...editingPalette.c}};applyPalette(state.customPalettes[i]);save()}}
$("#deletePalette").onclick=()=>{if(!editingPalette||editingPalette.builtIn)return;state.customPalettes=state.customPalettes.filter(x=>x.id!==editingPalette.id);$("#paletteEditor").classList.remove("show");applyPalette(DEFAULT);save()}
$("#saveNode").onclick=()=>{if(editingNodeId){const v=$("#nodeName").value.trim();if(v)node(editingNodeId).name=v;$("#editSheet").classList.remove("show");renderToday();renderMandala();renderActions();save()}}
$("#closeSheet").onclick=()=>$("#editSheet").classList.remove("show");
$$("[data-page]").forEach((b,i)=>b.onclick=()=>setPage(i));
viewport.addEventListener("touchstart",e=>{if(e.touches.length!==1||e.target.closest("input"))return;const t=e.touches[0];gesture={x:t.clientX,y:t.clientY,dx:0,dy:0,lock:null,page:state.page};track.style.transition="none"},{passive:true});
viewport.addEventListener("touchmove",e=>{if(!gesture||e.touches.length!==1)return;const t=e.touches[0];gesture.dx=t.clientX-gesture.x;gesture.dy=t.clientY-gesture.y;if(!gesture.lock&&(Math.abs(gesture.dx)>8||Math.abs(gesture.dy)>8))gesture.lock=Math.abs(gesture.dx)>Math.abs(gesture.dy)*1.15?"x":"y";if(gesture.lock==="x"){let px=gesture.dx;if((state.page===0&&px>0)||(state.page===3&&px<0))px*=.28;track.style.transform=`translate3d(${-state.page*viewport.clientWidth+px}px,0,0)`}},{passive:true});
viewport.addEventListener("touchend",()=>{if(!gesture)return;const g=gesture;gesture=null;if(g.lock==="x"&&Math.abs(g.dx)>55)setPage(g.page+(g.dx<0?1:-1));else setPage(g.page)},{passive:true});
load();state.customPalettes=state.customPalettes||[];applyPalette(activePalette());renderToday();renderMandala();renderActions();renderPaletteList();setPage(state.page||0,false);
})();
</script>
</body></html>
